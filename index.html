<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Order, cost and content dashboard for crave.bites.sby, a preorder cake business in Surabaya.">
<meta name="theme-color" content="#2E1007">
<title>Crave Bites Studio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens: light (default) ---------- */
:root{
  --bg:#FBEBD0;
  --bg-tint:#F7E2C2;
  --surface:#FFFaF0;
  --surface-2:#F8EAD2;
  --surface-3:#F2DDBC;
  --line:#E7CFAA;
  --line-soft:#F0DFC3;
  --ink:#3A1409;
  --ink-2:#6E4630;
  --ink-3:#9C7A5C;
  --accent:#A47B5F;
  --accent-deep:#7E5335;
  --accent-soft:#EBD6BC;
  --choco:#4A1C0F;
  --good:#4E7A45;
  --good-bg:#E3EDDC;
  --warn:#B4801E;
  --warn-bg:#F6E7C2;
  --bad:#A63B26;
  --bad-bg:#F6DDD5;
  --info:#5B6E8C;
  --info-bg:#E2E7EF;
  --side-bg:#2E1007;
  --side-bg-2:#3C1A0D;
  --side-ink:#F6E6C9;
  --side-ink-dim:#BC9877;
  --side-line:#4E2413;
  --bar:#B08260;
  --bar-strong:#7E5335;
  --grid:#E7CFAA;
  --shadow:0 1px 2px rgba(74,28,15,.06), 0 8px 24px -14px rgba(74,28,15,.34);
  --shadow-lift:0 2px 4px rgba(74,28,15,.08), 0 18px 40px -20px rgba(74,28,15,.45);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --font-display:'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --font-body:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0A04;
    --bg-tint:#22100A;
    --surface:#2A130B;
    --surface-2:#341B10;
    --surface-3:#402415;
    --line:#4E2C1A;
    --line-soft:#3B1E11;
    --ink:#F8E8CB;
    --ink-2:#D8B993;
    --ink-3:#AB8763;
    --accent:#CE9E76;
    --accent-deep:#E0B58D;
    --accent-soft:#3E2113;
    --choco:#F0DCBB;
    --good:#8CBB7E;
    --good-bg:#26341F;
    --warn:#DFB25C;
    --warn-bg:#3A2C10;
    --bad:#E08A72;
    --bad-bg:#3C1B13;
    --info:#9FB1CC;
    --info-bg:#222934;
    --side-bg:#140703;
    --side-bg-2:#1F0D06;
    --side-ink:#F6E6C9;
    --side-ink-dim:#AE8A69;
    --side-line:#37190C;
    --bar:#B7875F;
    --bar-strong:#DDAE81;
    --grid:#4E2C1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#1B0A04; --bg-tint:#22100A; --surface:#2A130B; --surface-2:#341B10; --surface-3:#402415;
  --line:#4E2C1A; --line-soft:#3B1E11; --ink:#F8E8CB; --ink-2:#D8B993; --ink-3:#AB8763;
  --accent:#CE9E76; --accent-deep:#E0B58D; --accent-soft:#3E2113; --choco:#F0DCBB;
  --good:#8CBB7E; --good-bg:#26341F; --warn:#DFB25C; --warn-bg:#3A2C10; --bad:#E08A72; --bad-bg:#3C1B13;
  --info:#9FB1CC; --info-bg:#222934;
  --side-bg:#140703; --side-bg-2:#1F0D06; --side-ink:#F6E6C9; --side-ink-dim:#AE8A69; --side-line:#37190C;
  --bar:#B7875F; --bar-strong:#DDAE81; --grid:#4E2C1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-deep); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:244px minmax(0,1fr); min-height:100%}

.side{
  background:linear-gradient(175deg,var(--side-bg-2),var(--side-bg));
  color:var(--side-ink); position:sticky; top:env(safe-area-inset-top,0px);
  height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:4px;
  padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px)); border-right:1px solid var(--side-line);
}
.brand{display:block; padding:2px 6px 14px}
.brand img{width:100%; max-width:188px; display:block}
.brand .loc{
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--side-ink-dim); margin-top:6px; padding-left:2px;
}
.navgroup{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--side-ink-dim); padding:14px 10px 6px}
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:var(--side-ink); padding:9px 10px; border-radius:10px;
  cursor:pointer; font-size:13.5px; font-weight:500; transition:background .15s;
}
.navbtn:hover{background:rgba(255,255,255,.07)}
.navbtn[aria-current="true"]{background:var(--accent); color:#2A1006; font-weight:700}
.navbtn .ic{width:18px; text-align:center; font-size:15px; flex:none}
.navbtn .ct{margin-left:auto; font-size:11px; color:var(--side-ink-dim); font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .ct{color:#5A2A12}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--side-line); display:flex; gap:6px}
.side-foot button{
  flex:1; background:rgba(255,255,255,.06); border:1px solid var(--side-line); color:var(--side-ink);
  border-radius:9px; padding:7px 6px; font-size:11.5px; cursor:pointer;
}
.side-foot button:hover{background:rgba(255,255,255,.12)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
  padding:14px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.topbar h1{font-size:22px; font-weight:700; color:var(--choco)}
.topbar .sub{font-size:12.5px; color:var(--ink-3); margin-top:-2px}
.topbar .spacer{flex:1}
.burger{display:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 11px; cursor:pointer}
.content{padding:20px 22px 64px; display:flex; flex-direction:column; gap:18px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed; inset:0 auto 0 0; width:260px; z-index:60; height:100%;
    transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--shadow-lift);
  }
  body.nav-open .side{transform:none}
  .burger{display:block}
  .scrim{position:fixed; inset:0; background:rgba(28,10,4,.5); z-index:50; display:none}
  body.nav-open .scrim{display:block}
  .topbar,.content{padding-left:16px; padding-right:16px}
}

/* ---------- cards & type ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px 0; flex-wrap:wrap}
.card-h h3{font-size:15.5px; font-weight:700; color:var(--choco)}
.card-h .hint{font-size:11.5px; color:var(--ink-3)}
.card-b{padding:14px 16px}
.grid{display:grid; gap:14px}
.eyebrow{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13px}
.empty b{display:block; color:var(--ink-2); font-family:var(--font-display); font-size:15px; margin-bottom:3px}

/* ---------- KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:14px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:15px 16px 14px; position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent)}
.kpi.k2::before{background:var(--good)} .kpi.k3::before{background:var(--warn)} .kpi.k4::before{background:var(--info)}
.kpi .lbl{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kpi .val{font-family:var(--font-display); font-size:27px; font-weight:700; color:var(--choco); line-height:1.15; margin-top:5px; font-variant-numeric:tabular-nums}
.kpi .foot{font-size:11.5px; color:var(--ink-3); margin-top:4px}
.delta{font-weight:600; font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto; border-radius:var(--r); border:1px solid var(--line-soft); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:13px}
th{
  text-align:left; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  font-weight:700; padding:9px 11px; background:var(--surface-2); border-bottom:1px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:1;
}
td{padding:9px 11px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td.c,th.c{text-align:center}
td.nowrap{white-space:nowrap}
tfoot td{background:var(--surface-2); font-weight:700; border-top:1px solid var(--line)}
.rowact{display:flex; gap:5px; justify-content:flex-end}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:2.5px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; border:1px solid transparent}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.s-new{background:var(--info-bg); color:var(--info); border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.chip.s-wait{background:var(--warn-bg); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.s-go{background:var(--accent-soft); color:var(--accent-deep); border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.chip.s-done{background:var(--good-bg); color:var(--good); border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.chip.s-bad{background:var(--bad-bg); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.chip.s-mute{background:var(--surface-3); color:var(--ink-3); border-color:var(--line)}

/* ---------- buttons & fields ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:8px 13px; font-size:13px; font-weight:600;
  cursor:pointer; transition:background .14s, border-color .14s; white-space:nowrap;
}
.btn:hover{background:var(--surface-2); border-color:var(--accent)}
.btn.primary{background:var(--choco); color:var(--bg); border-color:var(--choco)}
.btn.primary:hover{background:var(--accent-deep); border-color:var(--accent-deep)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2); border-color:var(--line)}
.btn.sm{padding:5px 9px; font-size:12px; border-radius:8px}
.btn.danger{color:var(--bad)} .btn.danger:hover{background:var(--bad-bg); border-color:var(--bad)}
.iconbtn{background:none; border:1px solid transparent; border-radius:7px; padding:3px 6px; cursor:pointer; color:var(--ink-3); font-size:13px; line-height:1.3}
.iconbtn:hover{background:var(--surface-3); color:var(--ink); border-color:var(--line)}

.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field>label{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
input,select,textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px 10px;
  font-size:13px; width:100%; min-width:0; color:var(--ink);
}
input:disabled,select:disabled{background:var(--surface-3); color:var(--ink-3); cursor:not-allowed}
textarea{resize:vertical; min-height:62px}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%, calc(100% - 10px) 51%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}
.dd{display:flex; gap:4px; align-items:stretch}
.dd select{flex:1}
.dd .gear{
  flex:none; width:32px; border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
  cursor:pointer; color:var(--ink-3); font-size:13px;
}
.dd .gear:hover{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent)}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px}
.filters{display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end}
.filters .field{flex:1 1 138px; max-width:210px}
.filters input,.filters select{padding:7px 9px; font-size:12.5px}
.searchbox{flex:1 1 190px; max-width:280px}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0}
.tab{background:none; border:0; border-bottom:2px solid transparent; padding:8px 11px; font-size:13px; font-weight:600; color:var(--ink-3); cursor:pointer; border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink); background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--choco); border-bottom-color:var(--accent)}

/* ---------- modal ---------- */
.scrim2{position:fixed; inset:0; background:rgba(28,10,4,.55); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-lift); width:100%; max-width:760px; margin:auto}
.modal.wide{max-width:960px}
.modal.narrow{max-width:460px}
.modal-h{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line-soft)}
.modal-h h3{font-size:17px; font-weight:700; color:var(--choco)}
.modal-b{padding:16px 18px; display:flex; flex-direction:column; gap:14px}
.modal-f{display:flex; gap:9px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line-soft); flex-wrap:wrap}
.modal-f .left{margin-right:auto}

/* ---------- order line items ---------- */
.lineitem{border:1px solid var(--line); border-radius:var(--r); padding:12px; background:var(--surface-2); display:flex; flex-direction:column; gap:10px}
.lineitem .lh{display:flex; align-items:center; gap:8px}
.lineitem .lh .eyebrow{flex:1}
.sumline{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:3px 0}
.sumline.total{border-top:1px solid var(--line); margin-top:5px; padding-top:9px; font-weight:700; font-size:15px; color:var(--choco); font-family:var(--font-display)}
.sumline .num{font-variant-numeric:tabular-nums}

/* ---------- charts ---------- */
.chartgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; align-items:start}
svg.chart{display:block; width:100%; height:auto; overflow:visible}
.rank{display:flex; flex-direction:column; gap:9px}
.rank-row{display:grid; grid-template-columns:20px 1fr auto; gap:9px; align-items:center; font-size:13px}
.rank-row .n{font-size:11px; color:var(--ink-3); font-weight:700; font-variant-numeric:tabular-nums}
.rank-row .nm{min-width:0}
.rank-row .nm b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rank-bar{height:6px; border-radius:999px; background:var(--surface-3); margin-top:4px; overflow:hidden}
.rank-bar>i{display:block; height:100%; border-radius:999px; background:var(--bar)}
.rank-row .v{font-variant-numeric:tabular-nums; font-weight:600; font-size:12.5px; white-space:nowrap}
.rank-row .v small{display:block; font-weight:400; color:var(--ink-3); font-size:11px; text-align:right}
.tip{
  position:fixed; z-index:200; pointer-events:none; background:var(--choco); color:var(--bg);
  padding:6px 9px; border-radius:8px; font-size:12px; box-shadow:var(--shadow-lift); white-space:nowrap;
}
.tip b{font-variant-numeric:tabular-nums}

/* ---------- misc ---------- */
.progress{height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden; min-width:70px}
.progress>i{display:block; height:100%; background:var(--accent); border-radius:999px}
.progress.full>i{background:var(--good)}
.progress.over>i{background:var(--bad)}
.banner{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:var(--r); font-size:12.5px; border:1px solid var(--line); background:var(--surface-2); flex-wrap:wrap}
.banner.warn{background:var(--warn-bg); border-color:color-mix(in srgb,var(--warn) 34%,transparent); color:var(--warn)}
.banner .spacer{flex:1}
.toast{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--choco); color:var(--bg); padding:10px 17px; border-radius:999px; font-size:13px; font-weight:600;
  z-index:300; box-shadow:var(--shadow-lift);
}
.pill-row{display:flex; gap:6px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep); font-weight:600}
.optlist{display:flex; flex-direction:column; gap:7px; max-height:330px; overflow-y:auto; padding-right:3px}
.optrow{display:flex; gap:7px; align-items:center}
.optrow input{flex:1}
.optrow input.price{max-width:120px}
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.cal .hd{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); text-align:center; font-weight:700; padding:3px 0}
.cal .day{min-height:78px; border:1px solid var(--line-soft); border-radius:9px; padding:5px; background:var(--surface); font-size:11px; display:flex; flex-direction:column; gap:3px}
.cal .day.out{opacity:.4}
.cal .day .dn{font-weight:700; color:var(--ink-3); font-size:10.5px}
.cal .ev{background:var(--accent-soft); color:var(--accent-deep); border-radius:5px; padding:2px 5px; font-size:10.5px; line-height:1.3; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cal .ev.posted{background:var(--good-bg); color:var(--good)}
.stack{display:flex; flex-direction:column; gap:14px}
.row-split{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="scrim" id="navScrim" hidden></div>
<div class="app">

<script>
/* =========================================================================
   crave.bites.sby — order & cost studio
   All data lives in this browser (localStorage). Use Settings → Backup to
   move it between devices.
   ========================================================================= */
"use strict";

const KEY = "cravebites.sby.v1";
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = p => (p || "id") + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

/* ---------- formatting ---------- */
const nf = new Intl.NumberFormat("id-ID");
const rp   = n => "Rp " + nf.format(Math.round(Number(n) || 0));
const rpK  = n => { n = Number(n) || 0; return Math.abs(n) >= 1e6 ? "Rp " + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + " jt"
                  : Math.abs(n) >= 1e3 ? "Rp " + Math.round(n / 1e3) + "rb" : "Rp " + nf.format(Math.round(n)); };
const pct  = n => (Number(n) || 0).toFixed(0) + "%";
const MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW  = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const iso  = d => { const x = new Date(d); return isNaN(x) ? "" : [x.getFullYear(), String(x.getMonth()+1).padStart(2,"0"), String(x.getDate()).padStart(2,"0")].join("-"); };
const today= () => iso(new Date());
function fdate(s, withYear){
  if (!s) return "—";
  const p = String(s).split("-"); if (p.length < 3) return s;
  return Number(p[2]) + " " + MON[Number(p[1]) - 1] + (withYear ? " " + p[0] : "");
}
const ym    = s => (s || "").slice(0, 7);
const fmonth= k => k ? MON[Number(k.slice(5,7)) - 1] + " " + k.slice(0,4) : "—";
const esc   = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num   = v => { const n = parseFloat(String(v).replace(/[^\d.-]/g, "")); return isNaN(n) ? 0 : n; };
function addDays(s, n){ const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); }
function weekStart(s){ const d = new Date(s + "T00:00:00"); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return iso(d); }

/* ---------- default option lists (all editable in-app) ---------- */
const DEFAULT_OPTIONS = {
  deliveryMethod : ["Gojek by customer","Gojek by brand","Pickup","Batch shipment by brand","Free shipping"],
  orderStatus    : ["New","Awaiting payment","Confirmed","Baking","Ready","Completed","Cancelled"],
  size           : ["Small","Medium","Large","Cup"],
  productStatus  : ["Active","Pending","Discontinued"],
  category       : ["Brownies","Cake","Cookies","Pastry"],
  expenseCategory: ["Ingredients","Packaging","Equipment","Marketing","Delivery","Other"],
  unit           : ["gr","kg","ml","l","pcs","pack","box","sheet"],
  packagingType  : ["Box","Label / sticker","Paper bag","Other"],
  supplier       : ["Toko Bahan Kue Kembang Jepun","Pasar Atom","Shopee","Tokopedia","Local dairy"],
  platform       : ["Instagram","TikTok","WhatsApp Status","Shopee"],
  contentType    : ["Short video","60s video","Long video","Poster","Carousel","Story"],
  contentPillar  : ["Food close up","Behind the scene","Storytelling","Selling","Preorder info","Funny scene","Static poster"],
  contentStatus  : ["Idea","Scripted","Filming","Editing","Scheduled","Posted"],
  inventoryKind  : ["Ingredient","Packaging"]
};
const OPTION_LABELS = {
  deliveryMethod:"Delivery method", orderStatus:"Order status", size:"Size", productStatus:"Product status",
  category:"Product category", expenseCategory:"Expense category", unit:"Unit of measure", packagingType:"Packaging type",
  supplier:"Supplier", platform:"Platform", contentType:"Content type", contentPillar:"Content pillar",
  contentStatus:"Content status", inventoryKind:"Inventory kind"
};
/* where each option list is used, so renaming an option updates old records */
const OPTION_USAGE = {
  deliveryMethod : [["orders","deliveryMethod"]],
  orderStatus    : [["orders","status"]],
  size           : [["orders","items[].size"],["products","sizes[].size"],["costSetups","size"]],
  productStatus  : [["products","status"]],
  category       : [["products","category"]],
  expenseCategory: [["expenses","category"]],
  unit           : [["expenses","unit"],["inventory","unit"],["recipes","lines[].unit"]],
  packagingType  : [["packaging","type"]],
  supplier       : [["expenses","supplier"],["inventory","supplier"]],
  platform       : [["content","platform"]],
  contentType    : [["content","type"]],
  contentPillar  : [["content","pillar"]],
  contentStatus  : [["content","status"]],
  inventoryKind  : [["inventory","kind"]]
};

/* ---------- state ---------- */
let S = null;

function blankState(){
  return {
    v: 1,
    settings: {
      openingCash: 0,
      revenueStatuses: ["Completed"],
      pipelineStatuses: ["Confirmed","Baking","Ready","Completed"],
      freeDelivery: ["Gojek by customer","Pickup","Free shipping"],
      sample: false
    },
    options  : JSON.parse(JSON.stringify(DEFAULT_OPTIONS)),
    priceLists: [], products: [], flavors: [], toppings: [], recipes: [],
    packaging: [], costSetups: [], inventory: [], batches: [], orders: [],
    expenses: [], content: [], seq: { order: 0 }
  };
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Could not save — browser storage is full or blocked"); }
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.options) return p; }
  } catch (e) {}
  return null;
}

/* ---------- pricing helpers ---------- */
const product   = id => S.products.find(p => p.id === id);
const variant   = (id, size) => { const p = product(id); return p && p.sizes.find(s => s.size === size); };
const prodName  = id => { const p = product(id); return p ? p.name : "—"; };
const flavorAdd = n => { const f = S.flavors.find(f => f.name === n);  return f ? f.price : 0; };
const topAdd    = n => { const t = S.toppings.find(t => t.name === n); return t ? t.price : 0; };
const vCode     = (id, size) => id + "-" + String(size || "?").trim().charAt(0).toUpperCase();

function unitPrice(it){
  const v = variant(it.productId, it.size);
  return (v ? v.price : 0) + flavorAdd(it.flavor) + topAdd(it.topping);
}
function orderItemsTotal(o){ return (o.items || []).reduce((s, it) => s + unitPrice(it) * (Number(it.qty) || 0), 0); }
function orderAddons(o){ return (o.addons || []).reduce((s, a) => s + (Number(a.price) || 0), 0); }
function orderTotal(o){ return orderItemsTotal(o) + orderAddons(o); }
function orderPayment(o){ return orderTotal(o) + (Number(o.deliveryFee) || 0); }
const isFreeDelivery = m => (S.settings.freeDelivery || []).includes(m);
const countsAsRevenue = o => (S.settings.revenueStatuses || []).includes(o.status);
const inPipeline      = o => (S.settings.pipelineStatuses || []).includes(o.status);

/* ---------- cost helpers ---------- */
const activePriceListId = () => (S.priceLists[S.priceLists.length - 1] || {}).id;
function recipeFor(productId, priceListId){
  const list = S.recipes.filter(r => r.productId === productId && r.priceListId === priceListId);
  if (list.length) return list[list.length - 1];
  const any = S.recipes.filter(r => r.productId === productId);
  return any[any.length - 1] || null;
}
const panCost = r => r ? (r.lines || []).reduce((s, l) => s + (Number(l.cost) || 0), 0) : 0;

function ingredientCost(productId, size, plId){
  const v = variant(productId, size);
  const r = recipeFor(productId, plId || activePriceListId());
  if (!v || !r) return 0;
  const frac = Number(v.panFraction) || 1;
  return panCost(r) / frac;
}
function packItem(id, plId){
  if (!id) return null;
  const p = S.packaging.find(x => x.id === id);
  if (!p) return null;
  const sameName = S.packaging.filter(x => x.name === p.name && x.priceListId === (plId || activePriceListId()));
  return sameName.length ? sameName[sameName.length - 1] : p;
}
function packagingCost(setup, plId){
  if (!setup) return 0;
  return ["boxId","labelId","bagId"].reduce((s, k) => { const p = packItem(setup[k], plId); return s + (p ? Number(p.price) || 0 : 0); }, 0);
}
const setupFor = (productId, size) => S.costSetups.find(c => c.productId === productId && c.size === size);

function costBreakdown(productId, size, plId){
  const v = variant(productId, size) || { price: 0 };
  const setup = setupFor(productId, size);
  const ing  = ingredientCost(productId, size, plId);
  const pack = packagingCost(setup, plId);
  const other= setup ? Number(setup.otherCost) || 0 : 0;
  const total= ing + pack + other;
  const sell = Number(v.price) || 0;
  return { sell, ing, pack, other, total, profit: sell - total, margin: sell ? (sell - total) / sell * 100 : 0 };
}
/* price list used when the order sits in a batch that pins one */
function orderPriceList(o){
  const b = S.batches.find(b => b.id === o.batchId);
  return (b && b.priceListId) || activePriceListId();
}
function orderCOGS(o){
  return (o.items || []).reduce((s, it) => s + costBreakdown(it.productId, it.size, orderPriceList(o)).total * (Number(it.qty) || 0), 0);
}

<script>
/* =========================== UI kit =========================== */
let toastTimer = null;
function toast(msg){
  const r = $("#toastRoot");
  r.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { r.innerHTML = ""; }, 2600);
}

/* modal: body html + footer buttons. onSave receives the modal element. */
let modalStack = [];
function openModal(opts){
  const root = $("#modalRoot");
  const wrap = document.createElement("div");
  wrap.className = "scrim2";
  wrap.innerHTML =
    '<div class="modal ' + (opts.size || "") + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + esc(opts.title) + "</h3>" +
        '<div style="flex:1"></div><button class="iconbtn" data-close aria-label="Close">✕</button></div>' +
      '<div class="modal-b">' + opts.body + "</div>" +
      '<div class="modal-f">' + (opts.footLeft || "") +
        '<button class="btn" data-close>' + esc(opts.cancelText || "Cancel") + "</button>" +
        (opts.saveText === null ? "" : '<button class="btn primary" data-save>' + esc(opts.saveText || "Save") + "</button>") +
      "</div></div>";
  root.appendChild(wrap);
  modalStack.push(wrap);
  const close = () => { wrap.remove(); modalStack = modalStack.filter(m => m !== wrap); };
  wrap.addEventListener("click", e => {
    if (e.target === wrap || e.target.closest("[data-close]")) { close(); return; }
    if (e.target.closest("[data-save]")) { if (!opts.onSave || opts.onSave(wrap) !== false) close(); }
  });
  if (opts.onOpen) opts.onOpen(wrap, close);
  const f = wrap.querySelector("input,select,textarea");
  if (f) setTimeout(() => f.focus(), 30);
  return { el: wrap, close };
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modalStack.length) modalStack[modalStack.length - 1].querySelector("[data-close]").click();
});

function confirmModal(title, msg, onYes, yesText){
  openModal({ title, size: "narrow", body: '<p style="margin:0">' + esc(msg) + "</p>",
    saveText: yesText || "Delete", onSave: () => { onYes(); } });
}

/* ---------- editable dropdown ---------- */
/* kind: "option" (generic list) | "flavor" | "topping" | "product" | custom list fn */
function ddHTML(kind, key, value, attrs){
  const a = attrs || {};
  let opts = [];
  if (kind === "option")       opts = (S.options[key] || []).map(o => [o, o]);
  else if (kind === "flavor")  opts = S.flavors.map(f => [f.name, f.name + (f.price ? "  +" + rp(f.price) : "")]);
  else if (kind === "topping") opts = S.toppings.map(t => [t.name, t.name + (t.price ? "  +" + rp(t.price) : "")]);
  else if (kind === "product") opts = S.products.filter(p => p.status !== "Discontinued").map(p => [p.id, p.name]);
  else if (kind === "batch")   opts = S.batches.map(b => [b.id, b.name + " · " + fdate(b.datePlanned)]);
  else if (kind === "pricelist") opts = S.priceLists.map(p => [p.id, p.name]);
  else if (kind === "list")    opts = (a.list || []).map(o => Array.isArray(o) ? o : [o, o]);
  const sel = opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(value) ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("");
  const blank = a.blank ? '<option value="">' + esc(a.blank) + "</option>" : "";
  const gearKind = a.noGear ? "" :
    '<button type="button" class="gear" data-dd="' + kind + '" data-ddkey="' + esc(key || "") + '" title="Add or edit the choices in this list">⚙</button>';
  return '<div class="dd">' +
    '<select ' + (a.id ? 'id="' + a.id + '" ' : "") + (a.name ? 'data-f="' + a.name + '" ' : "") + (a.cls ? 'class="' + a.cls + '" ' : "") + ">" +
      blank + sel + "</select>" + gearKind + "</div>";
}

/* refresh every dropdown of a kind on the page, keeping current values */
function refreshDDs(kind, key){
  $$(".dd").forEach(dd => {
    const g = dd.querySelector(".gear");
    if (!g || g.dataset.dd !== kind || (key && g.dataset.ddkey !== key)) return;
    const s = dd.querySelector("select"), v = s.value;
    const tmp = document.createElement("div");
    tmp.innerHTML = ddHTML(kind, key, v, { blank: s.options[0] && s.options[0].value === "" ? s.options[0].text : null,
      name: s.dataset.f, id: s.id, cls: s.className });
    const fresh = tmp.querySelector("select");
    s.innerHTML = fresh.innerHTML;
    s.value = v;
    if (s.value !== v && s.options.length) s.selectedIndex = 0;
    s.dispatchEvent(new Event("change", { bubbles: true }));
  });
}

document.addEventListener("click", e => {
  const g = e.target.closest(".gear");
  if (!g) return;
  e.preventDefault();
  const kind = g.dataset.dd, key = g.dataset.ddkey;
  if (kind === "option")       optionEditor(key);
  else if (kind === "flavor")  priceListEditor("flavors",  "Flavors", "Add-on price");
  else if (kind === "topping") priceListEditor("toppings", "Toppings", "Add-on price");
  else if (kind === "product") { go("products"); toast("Add or edit products in the Menu tab"); }
  else if (kind === "batch")   { go("production"); toast("Add or edit baking batches here"); }
  else if (kind === "pricelist"){ go("products"); productsTab = "prices"; render(); }
});

/* rename an option everywhere it was already used */
function renameEverywhere(key, oldV, newV){
  (OPTION_USAGE[key] || []).forEach(([coll, path]) => {
    (S[coll] || []).forEach(rec => {
      if (path.includes("[]")){
        const [arr, sub] = path.split("[].");
        (rec[arr] || []).forEach(r => { if (r[sub] === oldV) r[sub] = newV; });
      } else if (rec[path] === oldV) rec[path] = newV;
    });
  });
  ["revenueStatuses","pipelineStatuses","freeDelivery"].forEach(k => {
    S.settings[k] = (S.settings[k] || []).map(v => v === oldV ? newV : v);
  });
}

function optionEditor(key){
  const rows = (S.options[key] || []).map(o =>
    '<div class="optrow"><input value="' + esc(o) + '" data-old="' + esc(o) + '">' +
    '<button type="button" class="iconbtn" data-del title="Remove">✕</button></div>').join("");
  openModal({
    title: OPTION_LABELS[key] || key, size: "narrow",
    body: '<p class="muted" style="margin:0;font-size:12.5px">Rename a choice and every record that used it is updated too. Removing one leaves old records untouched.</p>' +
      '<div class="optlist" id="optList">' + rows + "</div>" +
      '<button type="button" class="btn sm" id="optAdd">+ Add choice</button>',
    onOpen: w => {
      $("#optAdd", w).onclick = () => {
        const d = document.createElement("div");
        d.className = "optrow";
        d.innerHTML = '<input placeholder="New choice" data-old=""><button type="button" class="iconbtn" data-del title="Remove">✕</button>';
        $("#optList", w).appendChild(d); d.querySelector("input").focus();
      };
      $("#optList", w).addEventListener("click", ev => { const b = ev.target.closest("[data-del]"); if (b) b.parentElement.remove(); });
    },
    onSave: w => {
      const out = [];
      $$("#optList .optrow", w).forEach(r => {
        const inp = r.querySelector("input"), v = inp.value.trim(), old = inp.dataset.old;
        if (!v) return;
        if (old && old !== v) renameEverywhere(key, old, v);
        if (!out.includes(v)) out.push(v);
      });
      if (!out.length) { toast("Keep at least one choice"); return false; }
      S.options[key] = out; save(); refreshDDs("option", key); render();
      toast((OPTION_LABELS[key] || key) + " updated");
    }
  });
}

/* flavors / toppings: name + add-on price */
function priceListEditor(coll, title, priceLabel){

  openModal({

      '<div class="optlist" id="optList">' + rows + "</div>" +
      '<button type="button" class="btn sm" id="optAdd">+ Add ' + esc(title.toLowerCase().replace(/s$/, "")) + "</button>",
    onOpen: w => {
      $("#optAdd", w).onclick = () => {
        const d = document.createElement("div");
        d.className = "optrow";
        d.innerHTML = '<input placeholder="Name" data-old=""><input class="price num" type="number" min="0" step="500" value="0">' +
          '<button type="button" class="iconbtn" data-del title="Remove">✕</button>';
        $("#optList", w).appendChild(d); d.querySelector("input").focus();
      };
      $("#optList", w).addEventListener("click", ev => { const b = ev.target.closest("[data-del]"); if (b) b.parentElement.remove(); });
    },
    onSave: w => {

      $$("#optList .optrow", w).forEach(r => {

    }

}

/* ---------- status chips ---------- */
function statusChip(st){
  const k = String(st || "").toLowerCase();
  let c = "s-mute";
  if (k === "new") c = "s-new";
  else if (k.includes("await")) c = "s-wait";
  else if (["confirmed","baking","ready","scheduled","editing","filming","scripted"].includes(k)) c = "s-go";
  else if (["completed","posted","active"].includes(k)) c = "s-done";
  else if (["cancelled","canceled","discontinued"].includes(k)) c = "s-bad";
  else if (["pending","idea"].includes(k)) c = "s-wait";
  return '<span class="chip ' + c + '"><span class="dot"></span>' + esc(st || "—") + "</span>";
}

/* ---------- charts (single series, theme-token colours) ---------- */
function barChart(data, opt){
  /* data: [{label, value, sub}] */
  const o = Object.assign({ h: 168, fmt: rp, pad: 26 }, opt || {});
  if (!data.length) return '<div class="empty">No data yet</div>';
  const W = 520, H = o.h, left = 4, right = 4, bottom = 26, top = 14;
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const bw  = (W - left - right) / data.length;
  const barW = Math.min(38, bw * 0.56);
  const plotH = H - bottom - top;
  const ticks = [0, 0.5, 1].map(t => t * max);
  let g = ticks.map(t => {
    const y = top + plotH - (t / max) * plotH;
    return '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) +
      '" stroke="var(--grid)" stroke-width="1" opacity=".55"/>' +
      '<text x="' + left + '" y="' + (y - 4).toFixed(1) + '" font-size="9.5" fill="var(--ink-3)">' + o.fmt(t) + "</text>";
  }).join("");
  let bars = data.map((d, i) => {
    const h = Math.max(d.value > 0 ? 3 : 0, (d.value / max) * plotH);
    const x = left + i * bw + (bw - barW) / 2, y = top + plotH - h;
    return '<g class="bg" data-tip="' + esc(d.label + (d.sub ? " · " + d.sub : "")) + " — " + esc(o.fmt(d.value)) + '">' +
      '<rect x="' + (left + i * bw) + '" y="' + top + '" width="' + bw + '" height="' + plotH + '" fill="transparent"/>' +
      '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="4" fill="var(--bar)"/>' +
      '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' + esc(d.label) + "</text>" +
      "</g>";
  }).join("");
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(o.aria || "Bar chart") + '">' + g + bars + "</svg>";
}

function rankList(rows, opt){
  const o = Object.assign({ fmt: n => nf.format(n), limit: 6 }, opt || {});
  if (!rows.length) return '<div class="empty">Nothing to rank yet</div>';
  const max = Math.max.apply(null, rows.map(r => r.value)) || 1;
  return '<div class="rank">' + rows.slice(0, o.limit).map((r, i) =>
    '<div class="rank-row"><span class="n">' + (i + 1) + "</span>" +
      '<span class="nm"><b>' + esc(r.label) + "</b>" +
        '<span class="rank-bar"><i style="width:' + Math.max(4, r.value / max * 100).toFixed(1) + '%"></i></span></span>' +
      '<span class="v">' + esc(o.fmt(r.value)) + (r.sub ? "<small>" + esc(r.sub) + "</small>" : "") + "</span></div>").join("") + "</div>";
}

/* hover tooltip for chart bars */
let tipEl = null;
document.addEventListener("mousemove", e => {
  const g = e.target.closest ? e.target.closest("g.bg") : null;
  if (g){
    if (!tipEl){ tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
    tipEl.textContent = g.dataset.tip;
    tipEl.style.left = Math.min(window.innerWidth - tipEl.offsetWidth - 10, e.clientX + 12) + "px";
    tipEl.style.top  = Math.max(6, e.clientY - 34) + "px";
  } else if (tipEl){ tipEl.remove(); tipEl = null; }
});

/* ---------- small builders ---------- */
function card(title, bodyHTML, hint, headExtra){
  return '<section class="card"><div class="card-h"><h3>' + esc(title) + "</h3>" +
    (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") +
    (headExtra ? '<div style="flex:1"></div>' + headExtra : "") +
    '</div><div class="card-b">' + bodyHTML + "</div></section>";
}
function tableHTML(cols, rows, foot){
  if (!rows.length) return '<div class="empty"><b>Nothing here yet</b>Add your first row with the button above.</div>';
  return '<div class="tablewrap"><table><thead><tr>' +
    cols.map(c => '<th class="' + (c.cls || "") + '">' + esc(c.t) + "</th>").join("") +
    "</tr></thead><tbody>" + rows.join("") + "</tbody>" + (foot || "") + "</table></div>";
}
function field(label, inner){ return '<div class="field"><label>' + esc(label) + "</label>" + inner + "</div>"; }
function inputF(label, name, value, type, attrs){
  return field(label, '<input data-f="' + name + '" type="' + (type || "text") + '" value="' + esc(value == null ? "" : value) + '" ' + (attrs || "") + ">");
}
const kpi = (cls, label, value, foot) =>
  '<div class="kpi ' + cls + '"><div class="lbl">' + esc(label) + '</div><div class="val">' + value + "</div>" +
  (foot ? '<div class="foot">' + foot + "</div>" : "") + "</div>";
function deltaHTML(cur, prev, label){
  if (!prev) return '<span class="muted">' + esc(label || "no comparison yet") + "</span>";
  const d = (cur - prev) / Math.abs(prev) * 100;
  return '<span class="delta ' + (d >= 0 ? "up" : "down") + '">' + (d >= 0 ? "▲" : "▼") + " " + Math.abs(d).toFixed(0) + "%</span> " +
    '<span class="muted">' + esc(label || "vs last month") + "</span>";
}
</script>

<script>
/* =========================== analytics =========================== */
const monthOrders = mk => S.orders.filter(o => ym(o.orderDate) === mk);
const revenueOrders = mk => S.orders.filter(o => countsAsRevenue(o) && ym(o.orderDate) === mk);
const revenueOf = list => list.reduce((s, o) => s + orderTotal(o), 0);
const deliveryCollected = list => list.reduce((s, o) => s + (Number(o.deliveryFee) || 0), 0);
const expensesOf = mk => S.expenses.filter(e => ym(e.date) === mk);
const expenseTotal = list => list.reduce((s, e) => s + (Number(e.amount) || 0), 0);
function expenseByCat(mk){
  const m = {};
  expensesOf(mk).forEach(e => { m[e.category] = (m[e.category] || 0) + (Number(e.amount) || 0); });
  return m;
}
function prevMonth(mk){
  const y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1;
  const d = new Date(y, m - 1, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function lastMonths(n, endKey){
  const out = [], y = +endKey.slice(0, 4), m = +endKey.slice(5, 7) - 1;
  for (let i = n - 1; i >= 0; i--){ const d = new Date(y, m - i, 1); out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
  return out;
}
function allMonths(){
  const set = new Set(S.orders.map(o => ym(o.orderDate)).concat(S.expenses.map(e => ym(e.date))).filter(Boolean));
  set.add(ym(today()));
  return Array.from(set).sort();
}
function customers(){
  const m = new Map();
  S.orders.forEach(o => {
    const k = (o.wa || o.customer || "").trim() || o.customer;
    if (!k) return;
    if (!m.has(k)) m.set(k, { key: k, name: o.customer, wa: o.wa, social: o.social, address: o.address, orders: [], spend: 0, last: "" });
    const c = m.get(k);
    c.name = o.customer || c.name; c.social = o.social || c.social; c.address = o.address || c.address;
    c.orders.push(o);
    if (countsAsRevenue(o)) c.spend += orderTotal(o);
    if (!c.last || o.orderDate > c.last) c.last = o.orderDate;
  });
  const fav = (arr, f) => { const m2 = {}; arr.forEach(x => { const v = f(x); if (v) m2[v] = (m2[v] || 0) + (Number(x.qty) || 1); });
    const e = Object.entries(m2).sort((a, b) => b[1] - a[1])[0]; return e ? e[0] : "—"; };
  return Array.from(m.values()).map(c => {
    const items = c.orders.flatMap(o => o.items || []);
    return Object.assign(c, {
      count: c.orders.length, repeat: c.orders.length >= 2,
      favProduct: fav(items, i => prodName(i.productId)), favSize: fav(items, i => i.size),
      favFlavor: fav(items, i => i.flavor), favTopping: fav(items, i => i.topping)
    });
  }).sort((a, b) => b.spend - a.spend);
}
function itemStats(list, keyFn){
  const m = {};
  list.forEach(o => (o.items || []).forEach(it => {
    const k = keyFn(it); if (!k) return;
    if (!m[k]) m[k] = { qty: 0, rev: 0 };
    m[k].qty += Number(it.qty) || 0;
    m[k].rev += unitPrice(it) * (Number(it.qty) || 0);
  }));
  return Object.entries(m).map(([label, v]) => ({ label, qty: v.qty, rev: v.rev }));
}
const batchOrders = bid => S.orders.filter(o => o.batchId === bid);
function batchFill(b){
  const done = batchOrders(b.id).filter(inPipeline).reduce((s, o) => s + (o.items || []).reduce((t, i) => t + (Number(i.qty) || 0), 0), 0);
  return { done, cap: Number(b.capacity) || 0, pct: b.capacity ? done / b.capacity * 100 : 0 };
}
const lowStock = () => S.inventory.filter(i => Number(i.stock) < Number(i.min));

/* =========================== dashboard =========================== */
let dashMonth = null;

function normDashMonth(){
  const months = allMonths();
  if (!dashMonth || months.indexOf(dashMonth) < 0) dashMonth = months[months.length - 1];
  return months;
}
function viewDashboard(){
  const months = normDashMonth();
  const mk = dashMonth, pk = prevMonth(mk);

  const rev  = revenueOf(revenueOrders(mk)), revP = revenueOf(revenueOrders(pk));
  const exp  = expenseTotal(expensesOf(mk)), expP = expenseTotal(expensesOf(pk));
  const net  = rev - exp, netP = revP - expP;
  const done = revenueOrders(mk).length;
  const cust = customers();
  const repeats = cust.filter(c => c.repeat).length;
  const newThis = monthOrders(mk).length;

  const head =
    '<div class="kpis">' +
      kpi("k1", "Revenue · " + fmonth(mk), rp(rev), deltaHTML(rev, revP)) +
      kpi("k2", "Net profit", rp(net), '<span class="muted">revenue − ' + rp(exp) + " expenses</span> " + (netP ? deltaHTML(net, netP, "") : "")) +
      kpi("k3", "Orders completed", nf.format(done), '<span class="muted">' + newThis + " orders placed this month</span>") +
      kpi("k4", "Repeat customers", nf.format(repeats), '<span class="muted">of ' + cust.length + " customers · 2+ orders</span>") +
    "</div>";

  /* orders per week, last 8 weeks up to the end of the selected month */
  const endW = weekStart(iso(new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0)));
  const weeks = [];
  for (let i = 7; i >= 0; i--){
    const ws = addDays(endW, -7 * i), we = addDays(ws, 6);
    const n = S.orders.filter(o => o.orderDate >= ws && o.orderDate <= we).length;
    weeks.push({ label: fdate(ws), value: n, sub: "week of " + fdate(ws, true) });
  }
  const weekChart = barChart(weeks, { fmt: n => nf.format(Math.round(n)), h: 176, aria: "Orders per week" });

  /* monthly revenue list */
  const mrows = lastMonths(6, mk).map(k => ({ label: fmonth(k), value: revenueOf(revenueOrders(k)), sub: revenueOrders(k).length + " orders" }));
  const mmax = Math.max.apply(null, mrows.map(r => r.value)) || 1;
  const monthList = '<div class="rank">' + mrows.map(r =>
    '<div class="rank-row"><span class="n">' + (r.label === fmonth(mk) ? "●" : "") + "</span>" +
    '<span class="nm"><b>' + esc(r.label) + "</b><span class=\"rank-bar\"><i style=\"width:" + Math.max(2, r.value / mmax * 100).toFixed(1) + '%"></i></span></span>' +
    '<span class="v">' + rpK(r.value) + "<small>" + esc(r.sub) + "</small></span></div>").join("") + "</div>";

  const sold = revenueOrders(mk);
  const best = itemStats(sold, i => prodName(i.productId) + " · " + i.size).sort((a, b) => b.qty - a.qty)
    .map(r => ({ label: r.label, value: r.qty, sub: rpK(r.rev) }));
  const tops = itemStats(sold, i => i.topping).sort((a, b) => b.qty - a.qty)
    .map(r => ({ label: r.label, value: r.qty, sub: rpK(r.rev) }));
  const flav = itemStats(sold, i => i.flavor).sort((a, b) => b.qty - a.qty)
    .map(r => ({ label: r.label, value: r.qty, sub: rpK(r.rev) }));

  const catMap = {};
  sold.forEach(o => (o.items || []).forEach(it => {
    const p = product(it.productId); const c = p ? p.category : "Uncategorised";
    if (!catMap[c]) catMap[c] = { rev: 0, qty: 0 };
    catMap[c].rev += unitPrice(it) * (Number(it.qty) || 0);
    catMap[c].qty += Number(it.qty) || 0;
  }));
  const catRows = Object.entries(catMap).sort((a, b) => b[1].rev - a[1].rev);
  const catTotal = catRows.reduce((s, r) => s + r[1].rev, 0) || 1;
  const catTable = catRows.length ? tableHTML(
    [{ t: "Category" }, { t: "Revenue", cls: "r" }, { t: "Share", cls: "r" }, { t: "Pcs sold", cls: "r" }],
    catRows.map(([c, v]) =>
      "<tr><td><b>" + esc(c) + "</b></td><td class=\"r\">" + rp(v.rev) + '</td><td class="r">' + pct(v.rev / catTotal * 100) +
      '</td><td class="r">' + nf.format(v.qty) + "</td></tr>"),
    '<tfoot><tr><td>Total</td><td class="r">' + rp(catTotal) + '</td><td class="r">100%</td><td class="r">' +
      nf.format(catRows.reduce((s, r) => s + r[1].qty, 0)) + "</td></tr></tfoot>") : '<div class="empty">No completed orders in this month yet</div>';

  /* upcoming batches */
  const upcoming = S.batches.slice().sort((a, b) => (a.datePlanned || "").localeCompare(b.datePlanned || "")).filter(b => b.datePlanned >= addDays(today(), -7)).slice(0, 4);
  const batchCard = upcoming.length ? '<div class="rank">' + upcoming.map(b => {
    const f = batchFill(b);
    return '<div class="rank-row"><span class="n">' + esc(b.name.replace(/[^0-9]/g, "") || "•") + "</span>" +
      '<span class="nm"><b>' + esc(b.name) + " · " + fdate(b.datePlanned) + "</b>" +
      '<span class="rank-bar"><i style="width:' + Math.min(100, f.pct).toFixed(0) + "%;background:" + (f.pct >= 100 ? "var(--bad)" : f.pct >= 80 ? "var(--warn)" : "var(--bar)") + '"></i></span></span>' +
      '<span class="v">' + f.done + "/" + f.cap + "<small>pcs booked</small></span></div>";
  }).join("") + "</div>" : '<div class="empty">No upcoming batches — add one in Baking batches</div>';

  const low = lowStock();
  const lowBanner = low.length ? '<div class="banner warn">⚠ <b>' + low.length + " ingredient" + (low.length > 1 ? "s are" : " is") +
    " below your minimum stock:</b> " + esc(low.slice(0, 4).map(i => i.name).join(", ")) + (low.length > 4 ? " +" + (low.length - 4) + " more" : "") +
    '<span class="spacer"></span><button class="btn sm" data-goto="products" data-tab="inventory">Open inventory</button></div>' : "";

  return lowBanner + head +
    '<div class="chartgrid">' +
      card("Orders per week", weekChart, "last 8 weeks · hover a bar") +
      card("Monthly revenue", monthList, "completed orders") +
    "</div>" +
    '<div class="chartgrid">' +
      card("Best selling products", rankList(best, { fmt: n => nf.format(n) + " pcs" }), fmonth(mk)) +
      card("Popular toppings", rankList(tops, { fmt: n => nf.format(n) + " pcs" }), fmonth(mk)) +
      card("Popular flavours", rankList(flav, { fmt: n => nf.format(n) + " pcs" }), fmonth(mk)) +
    "</div>" +
    '<div class="chartgrid" style="grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr)">' +
      card("Revenue by category", catTable, fmonth(mk)) +
      card("Batch fill rate", batchCard, "confirmed orders vs capacity") +
    "</div>";
}

function dashActions(){
  const months = normDashMonth();
  return '<div class="field" style="min-width:150px"><label class="sr">Month</label>' +
    '<select id="dashMonth">' + months.map(m => '<option value="' + m + '"' + (m === dashMonth ? " selected" : "") + ">" + fmonth(m) + "</option>").join("") + "</select></div>";
}
</script>

<script>
/* =========================== orders =========================== */
let oF = { from: "", to: "", month: "", q: "", status: "", method: "", batch: "" };

function filteredOrders(){
  return S.orders.filter(o => {
    if (oF.from && o.orderDate < oF.from) return false;
    if (oF.to   && o.orderDate > oF.to)   return false;
    if (oF.month && ym(o.orderDate) !== oF.month) return false;
    if (oF.status && o.status !== oF.status) return false;
    if (oF.method && o.deliveryMethod !== oF.method) return false;
    if (oF.batch  && o.batchId !== oF.batch) return false;
    if (oF.q){
      const q = oF.q.toLowerCase();
      const hay = [o.id, o.customer, o.wa, o.social, o.address, o.notes,
        (o.items || []).map(i => prodName(i.productId) + " " + i.size + " " + i.flavor + " " + i.topping).join(" ")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.orderDate || "").localeCompare(a.orderDate || "") || b.id.localeCompare(a.id));
}

function itemsSummary(o){
  return (o.items || []).map(it =>
    '<div style="white-space:nowrap"><b>' + (Number(it.qty) || 0) + "× " + esc(prodName(it.productId)) + "</b> " +
    '<span class="muted">' + esc(it.size) + (it.flavor && it.flavor !== "Original" ? " · " + esc(it.flavor) : "") +
    (it.topping && it.topping !== "Original" ? " · " + esc(it.topping) : "") + "</span></div>").join("") +
    ((o.addons || []).length ? '<div class="muted" style="font-size:11.5px">+ ' + esc(o.addons.map(a => a.name).join(", ")) + "</div>" : "");
}

function viewOrders(){
  const list = filteredOrders();
  const months = allMonths();
  const sumPay = list.reduce((s, o) => s + orderPayment(o), 0);
  const sumPcs = list.reduce((s, o) => s + (o.items || []).reduce((t, i) => t + (Number(i.qty) || 0), 0), 0);

  const filters =
    '<div class="filters">' +
      '<div class="field searchbox"><label>Search</label><input id="fQ" value="' + esc(oF.q) + '" placeholder="Name, WhatsApp, order ID, product…"></div>' +
      '<div class="field"><label>Month</label><select id="fMonth"><option value="">All months</option>' +
        months.map(m => '<option value="' + m + '"' + (m === oF.month ? " selected" : "") + ">" + fmonth(m) + "</option>").join("") + "</select></div>" +
      '<div class="field"><label>From</label><input type="date" id="fFrom" value="' + esc(oF.from) + '"></div>' +
      '<div class="field"><label>To</label><input type="date" id="fTo" value="' + esc(oF.to) + '"></div>' +
      '<div class="field"><label>Status</label><select id="fStatus"><option value="">All statuses</option>' +
        (S.options.orderStatus || []).map(s => '<option' + (s === oF.status ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></div>" +
      '<div class="field"><label>Delivery</label><select id="fMethod"><option value="">All methods</option>' +
        (S.options.deliveryMethod || []).map(s => '<option' + (s === oF.method ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></div>" +
      '<div class="field"><label>Batch</label><select id="fBatch"><option value="">All batches</option>' +
        S.batches.map(b => '<option value="' + b.id + '"' + (b.id === oF.batch ? " selected" : "") + ">" + esc(b.name) + "</option>").join("") + "</select></div>" +
      '<button class="btn" id="fClear">Clear</button>' +
    "</div>";

  const rows = list.map(o => {
    const b = S.batches.find(b => b.id === o.batchId);
    return "<tr>" +
      '<td class="nowrap"><b>' + esc(o.id) + "</b><div class=\"muted\" style=\"font-size:11.5px\">" + fdate(o.orderDate, true) + "</div></td>" +
      "<td><b>" + esc(o.customer || "—") + '</b><div class="muted" style="font-size:11.5px">' + esc(o.wa || "") + (o.social ? " · " + esc(o.social) : "") + "</div></td>" +
      "<td>" + itemsSummary(o) + "</td>" +
      '<td class="nowrap">' + (b ? esc(b.name) : '<span class="muted">—</span>') +
        '<div class="muted" style="font-size:11.5px">' + fdate(o.fulfillDate) + "</div></td>" +
      "<td>" + statusChip(o.status) + "</td>" +
      '<td class="r"><b>' + rp(orderPayment(o)) + "</b>" +
        (o.deliveryFee ? '<div class="muted" style="font-size:11.5px">' + rp(orderTotal(o)) + " + ongkir</div>" : "") + "</td>" +
      '<td class="nowrap"><span style="font-size:12px">' + esc(o.deliveryMethod || "—") + "</span>" +
        (o.deliveryFee ? '<div class="muted num" style="font-size:11.5px">' + rp(o.deliveryFee) + "</div>" : "") + "</td>" +
      '<td class="r"><div class="rowact">' +
        (o.wa ? '<a class="iconbtn" title="Open WhatsApp" target="_blank" rel="noopener" href="https://wa.me/62' + esc(String(o.wa).replace(/^0/, "").replace(/\D/g, "")) + '">✆</a>' : "") +
        '<button class="iconbtn" data-edit="' + esc(o.id) + '" title="Edit">✎</button>' +
        '<button class="iconbtn" data-del="' + esc(o.id) + '" title="Delete">🗑</button>' +
      "</div></td></tr>";
  });

  const foot = list.length ? '<tfoot><tr><td colspan="5">' + list.length + " orders · " + sumPcs + ' pcs</td><td class="r">' + rp(sumPay) + '</td><td colspan="2"></td></tr></tfoot>' : "";

  return filters + card("All orders", tableHTML(
    [{ t: "Order" }, { t: "Customer" }, { t: "Products" }, { t: "Batch / pickup" }, { t: "Status" }, { t: "Payment", cls: "r" }, { t: "Delivery" }, { t: "", cls: "r" }],
    rows, foot), list.length === S.orders.length ? "showing everything" : "showing " + list.length + " of " + S.orders.length);
}

/* ---------- order form ---------- */
function lineItemHTML(it, idx){
  it = it || { productId: (S.products[0] || {}).id, size: "", flavor: "Original", topping: "Original", qty: 1 };
  const p = product(it.productId) || S.products[0] || { sizes: [] };
  const sizes = (p.sizes || []).map(s => [s.size, s.size + " · " + rp(s.price)]);
  return '<div class="lineitem" data-line>' +
    '<div class="lh"><span class="eyebrow">Product ' + (idx + 1) + "</span>" +
      '<span class="num" data-linetotal style="font-weight:700"></span>' +
      '<button type="button" class="iconbtn" data-rmline title="Remove this product">✕</button></div>' +
    '<div class="formgrid">' +
      field("Product", ddHTML("product", "", it.productId, { name: "productId" })) +
      field("Size", ddHTML("list", "", it.size, { name: "size", list: sizes, noGear: true })) +
      field("Flavour", ddHTML("flavor", "", it.flavor, { name: "flavor" })) +
      field("Topping", ddHTML("topping", "", it.topping, { name: "topping" })) +
      inputF("Quantity", "qty", it.qty, "number", 'min="1" step="1"') +
      field("Unit price", '<input data-f="unitPrice" disabled value="">') +
    "</div></div>";
}
function addonHTML(a){
  a = a || { name: "", price: 0 };
  return '<div class="optrow" data-addon><input data-f="name" placeholder="Add-on name (e.g. greeting card)" value="' + esc(a.name) + '">' +
    '<input class="price num" data-f="price" type="number" min="0" step="500" value="' + (a.price || 0) + '">' +
    '<button type="button" class="iconbtn" data-rmaddon title="Remove">✕</button></div>';
}

function orderForm(existing){
  const next = S.batches.slice().sort((a, b) => (a.datePlanned || "").localeCompare(b.datePlanned || ""))
    .find(b => (b.datePlanned || "") >= today()) || S.batches[S.batches.length - 1] || {};
  const o = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: "", orderDate: today(), batchId: next.id || "", fulfillDate: next.datePlanned || "",
    deliveryMethod: (S.options.deliveryMethod || [])[0] || "", customer: "", wa: "", social: "", address: "",
    items: [null], addons: [], deliveryFee: 0, status: (S.options.orderStatus || [])[0] || "New", notes: ""
  };
  const body =
    '<div class="formgrid">' +
      inputF("Order date", "orderDate", o.orderDate, "date") +
      field("Baking batch", ddHTML("batch", "", o.batchId, { name: "batchId", blank: "— not assigned —" })) +
      inputF("Pickup / delivery date", "fulfillDate", o.fulfillDate, "date") +
      field("Delivery method", ddHTML("option", "deliveryMethod", o.deliveryMethod, { name: "deliveryMethod" })) +
      field("Order status", ddHTML("option", "orderStatus", o.status, { name: "status" })) +
    "</div>" +
    '<div class="formgrid">' +
      inputF("Customer name", "customer", o.customer, "text", 'placeholder="Nama customer"') +
      inputF("WhatsApp", "wa", o.wa, "text", 'placeholder="08…"') +
      inputF("Instagram / TikTok", "social", o.social, "text", 'placeholder="@username"') +
    "</div>" +
    field("Address", '<textarea data-f="address" placeholder="Alamat lengkap, Surabaya">' + esc(o.address) + "</textarea>") +
    '<div><div class="eyebrow" style="margin-bottom:7px">Products in this order</div>' +
      '<div id="lines" class="stack" style="gap:10px">' + (o.items.length ? o.items : [null]).map((it, i) => lineItemHTML(it, i)).join("") + "</div>" +
      '<button type="button" class="btn sm" id="addLine" style="margin-top:9px">+ Add another product</button></div>' +
    '<div><div class="eyebrow" style="margin-bottom:7px">Add-ons (optional)</div>' +
      '<div id="addons" class="optlist">' + (o.addons || []).map(addonHTML).join("") + "</div>" +
      '<button type="button" class="btn sm" id="addAddon" style="margin-top:9px">+ Add an add-on</button></div>' +
    '<div class="formgrid">' +
      inputF("Delivery fee", "deliveryFee", o.deliveryFee, "number", 'min="0" step="500"') +
      field("Notes", '<input data-f="notes" value="' + esc(o.notes) + '" placeholder="Catatan khusus">') +
    "</div>" +
    '<div class="card" style="box-shadow:none"><div class="card-b">' +
      '<div class="sumline"><span>Products</span><span class="num" id="sProducts">—</span></div>' +
      '<div class="sumline"><span>Add-ons</span><span class="num" id="sAddons">—</span></div>' +
      '<div class="sumline"><span>Delivery fee</span><span class="num" id="sFee">—</span></div>' +
      '<div class="sumline total"><span>Payment total</span><span class="num" id="sTotal">—</span></div>' +
      '<div class="sumline"><span class="muted">Estimated cost of these products</span><span class="num muted" id="sCost">—</span></div>' +
      '<div class="sumline"><span class="muted">Estimated profit</span><span class="num muted" id="sProfit">—</span></div>' +
    "</div></div>";

  openModal({
    title: existing ? "Edit order " + o.id : "New order", size: "wide", saveText: existing ? "Save changes" : "Create order",
    body,
    onOpen: w => {
      const read = () => {
        const g = n => $('[data-f="' + n + '"]', w);
        const items = $$("[data-line]", w).map(l => ({
          productId: $('[data-f="productId"]', l).value,
          size:      $('[data-f="size"]', l).value,
          flavor:    $('[data-f="flavor"]', l).value,
          topping:   $('[data-f="topping"]', l).value,
          qty:       Math.max(1, num($('[data-f="qty"]', l).value) || 1)
        })).filter(i => i.productId);
        const addons = $$("[data-addon]", w).map(a => ({ name: $('[data-f="name"]', a).value.trim(), price: num($('[data-f="price"]', a).value) })).filter(a => a.name);
        return { items, addons,
          deliveryMethod: g("deliveryMethod").value, deliveryFee: num(g("deliveryFee").value),
          batchId: g("batchId").value, status: g("status").value };
      };
      const sync = () => {
        /* size list follows the chosen product */
        $$("[data-line]", w).forEach(l => {
          const pid = $('[data-f="productId"]', l).value, sSel = $('[data-f="size"]', l);
          const p = product(pid);
          const want = sSel.value;
          const html = (p ? p.sizes : []).map(s => '<option value="' + esc(s.size) + '">' + esc(s.size) + " · " + rp(s.price) + "</option>").join("");
          if (sSel.dataset.pid !== pid){ sSel.innerHTML = html; sSel.dataset.pid = pid; if ([...sSel.options].some(o => o.value === want)) sSel.value = want; }
          const it = { productId: pid, size: sSel.value, flavor: $('[data-f="flavor"]', l).value, topping: $('[data-f="topping"]', l).value };
          const up = unitPrice(it), qty = Math.max(1, num($('[data-f="qty"]', l).value) || 1);
          $('[data-f="unitPrice"]', l).value = rp(up);
          $("[data-linetotal]", l).textContent = rp(up * qty);
        });
        const d = read();
        const free = isFreeDelivery(d.deliveryMethod);
        const feeEl = $('[data-f="deliveryFee"]', w);
        feeEl.disabled = free;
        feeEl.title = free ? "This delivery method is set to free in Settings" : "Type the ongkir you are charging";
        if (free && num(feeEl.value) !== 0) feeEl.value = 0;
        const oTmp = { items: d.items, addons: d.addons, deliveryFee: free ? 0 : d.deliveryFee, batchId: d.batchId };
        const prod = orderItemsTotal(oTmp), add = orderAddons(oTmp), fee = free ? 0 : d.deliveryFee;
        const cost = orderCOGS(oTmp);
        $("#sProducts", w).textContent = rp(prod);
        $("#sAddons", w).textContent   = rp(add);
        $("#sFee", w).textContent      = rp(fee) + (free ? "  (free for this method)" : "");
        $("#sTotal", w).textContent    = rp(prod + add + fee);
        $("#sCost", w).textContent     = rp(cost);
        const pf = prod + add - cost;
        $("#sProfit", w).textContent   = rp(pf) + (prod + add ? "  ·  " + pct(pf / (prod + add) * 100) + " margin" : "");
      };
      w.addEventListener("input", sync);
      w.addEventListener("change", sync);
      $("#addLine", w).onclick = () => {
        const c = $("#lines", w);
        c.insertAdjacentHTML("beforeend", lineItemHTML(null, c.children.length));
        sync();
      };
      $("#addAddon", w).onclick = () => { $("#addons", w).insertAdjacentHTML("beforeend", addonHTML(null)); sync(); };
      w.addEventListener("click", e => {
        if (e.target.closest("[data-rmline]")){
          const ls = $$("[data-line]", w);
          if (ls.length <= 1) { toast("An order needs at least one product"); return; }
          e.target.closest("[data-line]").remove();
          $$("[data-line]", w).forEach((l, i) => { $(".eyebrow", l).textContent = "Product " + (i + 1); });
          sync();
        }
        if (e.target.closest("[data-rmaddon]")){ e.target.closest("[data-addon]").remove(); sync(); }
      });
      /* pickup date follows the batch unless the user typed one */
      $('[data-f="batchId"]', w).addEventListener("change", ev => {
        const b = S.batches.find(b => b.id === ev.target.value);
        const f = $('[data-f="fulfillDate"]', w);
        if (b && b.datePlanned && !f.value) f.value = b.datePlanned;
      });
      sync();
    },
    onSave: w => {
      const g = n => $('[data-f="' + n + '"]', w);
      const items = $$("[data-line]", w).map(l => ({
        productId: $('[data-f="productId"]', l).value, size: $('[data-f="size"]', l).value,
        flavor: $('[data-f="flavor"]', l).value, topping: $('[data-f="topping"]', l).value,
        qty: Math.max(1, num($('[data-f="qty"]', l).value) || 1)
      })).filter(i => i.productId && i.size);
      if (!items.length){ toast("Pick a product and a size first"); return false; }
      if (!g("customer").value.trim()){ toast("Customer name is needed"); return false; }
      const method = g("deliveryMethod").value;
      const rec = {
        id: existing ? existing.id : "CB-" + String(++S.seq.order).padStart(4, "0"),
        orderDate: g("orderDate").value || today(),
        batchId: g("batchId").value,
        fulfillDate: g("fulfillDate").value,
        deliveryMethod: method,
        customer: g("customer").value.trim(), wa: g("wa").value.trim(), social: g("social").value.trim(),
        address: g("address").value.trim(),
        items,
        addons: $$("[data-addon]", w).map(a => ({ name: $('[data-f="name"]', a).value.trim(), price: num($('[data-f="price"]', a).value) })).filter(a => a.name),
        deliveryFee: isFreeDelivery(method) ? 0 : num(g("deliveryFee").value),
        status: g("status").value, notes: g("notes").value.trim()
      };
      if (existing) S.orders[S.orders.findIndex(x => x.id === existing.id)] = rec;
      else S.orders.push(rec);
      save(); render();
      toast(existing ? "Order saved" : "Order " + rec.id + " created");
    }
  });
}
</script>

<script>
/* =========================== generic record form =========================== */
/* f = {name,label,type,key,list,attrs,full}  type: text|number|money|date|textarea|option|product|pricelist|list */
function fieldHTML(f, rec){
  const v = rec && rec[f.name] != null ? rec[f.name] : (f.def != null ? f.def : "");
  switch (f.type){
    case "textarea": return field(f.label, '<textarea data-f="' + f.name + '" ' + (f.attrs || "") + ">" + esc(v) + "</textarea>");
    case "option":   return field(f.label, ddHTML("option", f.key, v, { name: f.name, blank: f.blank }));
    case "product":  return field(f.label, ddHTML("product", "", v, { name: f.name, blank: f.blank }));
    case "pricelist":return field(f.label, ddHTML("pricelist", "", v || activePriceListId(), { name: f.name }));
    case "list":     return field(f.label, ddHTML("list", "", v, { name: f.name, list: typeof f.list === "function" ? f.list() : f.list, blank: f.blank, noGear: f.noGear !== false }));
    case "number":
    case "money":    return inputF(f.label, f.name, v, "number", (f.attrs || 'min="0" step="' + (f.type === "money" ? "500" : "1") + '"'));
    case "date":     return inputF(f.label, f.name, v || today(), "date", f.attrs);
    default:         return inputF(f.label, f.name, v, "text", f.attrs);
  }
}
function readForm(w, fields){
  const out = {};
  fields.forEach(f => {
    const el = $('[data-f="' + f.name + '"]', w);
    if (!el) return;
    out[f.name] = (f.type === "number" || f.type === "money") ? num(el.value) : el.value.trim ? el.value.trim() : el.value;
  });
  return out;
}
function recordForm(opts){
  /* opts: {title, fields, record, onSave(data), size} */
  const rec = opts.record || {};
  openModal({
    title: opts.title, size: opts.size || "",
    body: (opts.intro ? '<p class="muted" style="margin:0;font-size:12.5px">' + opts.intro + "</p>" : "") +
      '<div class="formgrid">' + opts.fields.filter(f => !f.full).map(f => fieldHTML(f, rec)).join("") + "</div>" +
      opts.fields.filter(f => f.full).map(f => fieldHTML(f, rec)).join("") + (opts.extra || ""),
    saveText: opts.saveText || "Save",
    onOpen: opts.onOpen,
    onSave: w => {
      const d = readForm(w, opts.fields);
      if (opts.validate){ const msg = opts.validate(d, w); if (msg){ toast(msg); return false; } }
      opts.onSave(d, w);
      save(); render();
      toast(opts.toast || "Saved");
    }
  });
}
function delRec(coll, id, label){
  confirmModal("Delete " + label + "?", "This removes it from your data. You cannot undo it, but your backup file still has it.",
    () => { S[coll] = S[coll].filter(r => r.id !== id); save(); render(); toast(label + " deleted"); });
}

/* =========================== baking batches =========================== */
function viewProduction(){
  const rows = S.batches.slice().sort((a, b) => (a.datePlanned || "").localeCompare(b.datePlanned || "")).map(b => {
    const f = batchFill(b);
    const os = batchOrders(b.id);
    const pl = S.priceLists.find(p => p.id === b.priceListId);
    const cls = f.pct > 100 ? "over" : f.pct >= 100 ? "full" : "";
    return "<tr>" +
      "<td><b>" + esc(b.name) + "</b>" + (b.note ? '<div class="muted" style="font-size:11.5px">' + esc(b.note) + "</div>" : "") + "</td>" +
      '<td class="nowrap">' + fdate(b.datePlanned, true) + "</td>" +
      "<td>" + esc(b.products || "—") + "</td>" +
      '<td class="r">' + nf.format(b.capacity || 0) + " pcs</td>" +
      '<td><div class="row-split" style="gap:8px"><div class="progress ' + cls + '" style="flex:1"><i style="width:' + Math.min(100, f.pct).toFixed(0) + '%"></i></div>' +
        '<span class="num" style="font-weight:600;font-size:12.5px">' + pct(f.pct) + "</span></div>" +
        '<div class="muted" style="font-size:11.5px">' + f.done + " of " + f.cap + " pcs booked · " + os.filter(inPipeline).length + " confirmed orders</div></td>" +
      '<td class="nowrap">' + (pl ? esc(pl.name) : '<span class="muted">—</span>') + "</td>" +
      '<td class="r"><div class="rowact">' +
        '<button class="iconbtn" data-openorders="' + esc(b.id) + '" title="See this batch\'s orders">▤</button>' +
        '<button class="iconbtn" data-edit="' + esc(b.id) + '" title="Edit">✎</button>' +
        '<button class="iconbtn" data-del="' + esc(b.id) + '" title="Delete">🗑</button></div></td></tr>';
  });
  return card("Baking batches", tableHTML(
    [{ t: "Batch" }, { t: "Date planned" }, { t: "Products" }, { t: "Capacity", cls: "r" }, { t: "Fulfillment rate" }, { t: "Price list" }, { t: "", cls: "r" }],
    rows), "fulfillment counts pcs in confirmed, baking, ready and completed orders");
}
function batchForm(b){
  recordForm({
    title: b ? "Edit " + b.name : "New baking batch", record: b,
    fields: [
      { name: "name", label: "Batch name", def: "Batch " + (S.batches.length + 1) },
      { name: "datePlanned", label: "Date planned", type: "date" },
      { name: "capacity", label: "Capacity (pcs)", type: "number", def: 24 },
      { name: "priceListId", label: "Price list used", type: "pricelist" },
      { name: "products", label: "Products in this batch", attrs: 'placeholder="Brownies, Tiramisu"', full: true },
      { name: "note", label: "Note", type: "textarea", full: true }
    ],
    validate: d => !d.name ? "Give the batch a name" : "",
    toast: "Batch saved",
    onSave: d => { if (b) Object.assign(b, d); else S.batches.push(Object.assign({ id: uid("b") }, d)); }
  });
}
</script>

<script>
/* =========================== products & costs =========================== */
let productsTab = "margin";
let costPL = null;

const PRODUCT_TABS = [
  ["margin", "Price &amp; margin"], ["menu", "Menu"], ["choices", "Flavours &amp; toppings"],
  ["recipes", "Recipes &amp; COGS"], ["packaging", "Packaging"], ["prices", "Price versions"], ["inventory", "Inventory"]
];

function viewProducts(){
  if (!costPL || !S.priceLists.some(p => p.id === costPL)) costPL = activePriceListId();
  const tabs = '<div class="tabs" id="pTabs">' + PRODUCT_TABS.map(t =>
    '<button class="tab" data-tab="' + t[0] + '" aria-selected="' + (productsTab === t[0]) + '">' + t[1] + "</button>").join("") + "</div>";
  const body = { margin: tabMargin, menu: tabMenu, choices: tabChoices, recipes: tabRecipes,
                 packaging: tabPackaging, prices: tabPrices, inventory: tabInventory }[productsTab]();
  return tabs + body;
}
function plPicker(id){
  return '<div class="field" style="min-width:170px"><label>Price version</label><select id="' + id + '">' +
    S.priceLists.map(p => '<option value="' + p.id + '"' + (p.id === costPL ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + "</select></div>";
}

/* ---- price & margin ---- */
function tabMargin(){
  const rows = [];
  let tSell = 0, tCost = 0;
  S.products.forEach(p => (p.sizes || []).forEach(s => {
    const c = costBreakdown(p.id, s.size, costPL);
    if (p.status === "Active"){ tSell += c.sell; tCost += c.total; }
    const setup = setupFor(p.id, s.size);
    const box = packItem(setup && setup.boxId, costPL);
    rows.push("<tr>" +
      '<td class="nowrap"><b>' + esc(vCode(p.id, s.size)) + "</b></td>" +
      "<td><b>" + esc(p.name) + '</b><div class="muted" style="font-size:11.5px">' + esc(p.category) + " · " + esc(s.size) + "</div></td>" +
      "<td>" + statusChip(p.status) + "</td>" +
      '<td class="r">' + rp(c.sell) + "</td>" +
      '<td class="r">' + rp(c.ing) + '<div class="muted" style="font-size:11px">1/' + (s.panFraction || 1) + " pan</div></td>" +
      '<td class="r">' + rp(c.pack) + '<div class="muted" style="font-size:11px">' + esc(box ? box.name : "no box set") + "</div></td>" +
      '<td class="r">' + rp(c.other) + "</td>" +
      '<td class="r"><b>' + rp(c.total) + "</b></td>" +
      '<td class="r" style="color:' + (c.profit >= 0 ? "var(--good)" : "var(--bad)") + '"><b>' + rp(c.profit) + "</b></td>" +

      '<td class="r"><button class="iconbtn" data-costsetup="' + esc(p.id) + "|" + esc(s.size) + '" title="Choose packaging &amp; other cost">⚙</button></td></tr>');
  }));
  const avg = tSell ? (tSell - tCost) / tSell * 100 : 0;
  return card("Selling price vs real cost",
    tableHTML([{ t: "Code" }, { t: "Product" }, { t: "Status" }, { t: "Selling price", cls: "r" }, { t: "Ingredients", cls: "r" },

      rows, '<tfoot><tr><td colspan="8">Average margin across active items</td><td class="r"></td><td class="r">' + avg.toFixed(0) + '%</td><td></td></tr></tfoot>'),

function productForm(p){

        size: $('[data-f="size"]', r).value,

        panFraction: Math.max(1, num($('[data-f="panFraction"]', r).value) || 1)
      })).filter(s => s.size);

function recipeForm(productId){
  const existing = S.recipes.find(r => r.productId === productId && r.priceListId === costPL);
  const base = existing || recipeFor(productId, costPL);
  const lineRow = l => '<div class="optrow" data-rl>' +
    '<input data-f="ingredient" placeholder="Ingredient" value="' + esc(l.ingredient || "") + '">' +
    '<input class="price num" data-f="qty" type="number" min="0" step="any" value="' + (l.qty || 0) + '" style="max-width:86px" title="Usage">' +
    ddHTML("option", "unit", l.unit || "gr", { name: "unit", noGear: true }) +
    '<input class="price num" data-f="cost" type="number" min="0" step="500" value="' + (l.cost || 0) + '" title="Cost of that usage">' +
    '<button type="button" class="iconbtn" data-rmrl title="Remove">✕</button></div>';
  const lines = (base && base.lines || [{}]).map(lineRow).join("");
  openModal({
    title: prodName(productId) + " recipe — one pan",
    body: '<p class="muted" style="margin:0;font-size:12.5px">Type how much of each ingredient one pan uses and what that amount costs you. ' +
      "Saved under <b>" + esc((S.priceLists.find(p => p.id === costPL) || {}).name || "") + "</b>.</p>" +
      inputF("Date costed", "date", (existing && existing.date) || today(), "date") +
      '<div class="optlist" id="rlines">' + lines + "</div>" +
      '<button type="button" class="btn sm" id="addRL">+ Add ingredient</button>' +
      '<div class="sumline total"><span>Cost of one pan</span><span id="panTotal">—</span></div>',
    saveText: "Save recipe",
    onOpen: w => {
      const sync = () => {
        const t = $$("[data-rl]", w).reduce((s, r) => s + num($('[data-f="cost"]', r).value), 0);
        $("#panTotal", w).textContent = rp(t);
      };
      $("#addRL", w).onclick = () => { $("#rlines", w).insertAdjacentHTML("beforeend", lineRow({ unit: "gr" })); sync(); };
      w.addEventListener("click", e => { const b = e.target.closest("[data-rmrl]"); if (b){ b.parentElement.remove(); sync(); } });
      w.addEventListener("input", sync);
      sync();
    },
    onSave: w => {
      const lines = $$("[data-rl]", w).map(r => ({
        ingredient: $('[data-f="ingredient"]', r).value.trim(),
        qty: num($('[data-f="qty"]', r).value),
        unit: $('[data-f="unit"]', r).value,

      else S.recipes.push({ id: uid("rc"), productId, priceListId: costPL, date, lines });
      save(); render(); toast("Recipe saved");
    }
  });
}

      if (p){ Object.assign(p, d); return; }

      S.recipes.filter(r => r.priceListId === src).forEach(r =>
