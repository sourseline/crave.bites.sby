<script>
/* =========================== expenses =========================== */
let eF = { month: "", category: "", q: "" };

function viewExpenses(){
  const months = allMonths();
  const list = S.expenses.filter(e =>
    (!eF.month || ym(e.date) === eF.month) &&
    (!eF.category || e.category === eF.category) &&
    (!eF.q || [e.item, e.supplier, e.note, e.category].join(" ").toLowerCase().includes(eF.q.toLowerCase()))
  ).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const total = expenseTotal(list);

  const filters = '<div class="filters">' +
    '<div class="field searchbox"><label>Search</label><input id="eQ" value="' + esc(eF.q) + '" placeholder="Item, supplier, note…"></div>' +
    '<div class="field"><label>Month</label><select id="eMonth"><option value="">All months</option>' +
      months.map(m => '<option value="' + m + '"' + (m === eF.month ? " selected" : "") + ">" + fmonth(m) + "</option>").join("") + "</select></div>" +
    '<div class="field"><label>Category</label><select id="eCat"><option value="">All categories</option>' +
      (S.options.expenseCategory || []).map(c => '<option' + (c === eF.category ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select></div>" +
    '<button class="btn" id="eClear">Clear</button></div>';

  const rows = list.map(e =>
    '<tr><td class="nowrap">' + fdate(e.date, true) + "</td>" +
    "<td>" + statusChip(e.category) + "</td>" +
    "<td><b>" + esc(e.item) + "</b>" + (e.note ? '<div class="muted" style="font-size:11.5px">' + esc(e.note) + "</div>" : "") + "</td>" +
    '<td class="r">' + nf.format(e.qty || 0) + " " + esc(e.unit || "") + "</td>" +
    '<td class="r"><b>' + rp(e.amount) + "</b></td>" +
    "<td>" + esc(e.supplier || "—") + "</td>" +
    '<td class="r"><div class="rowact"><button class="iconbtn" data-edit="' + esc(e.id) + '" title="Edit">✎</button>' +
    '<button class="iconbtn" data-del="' + esc(e.id) + '" title="Delete">🗑</button></div></td></tr>');

  const byCat = {};
  list.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
  const catRank = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));

  return filters +
    '<div class="chartgrid" style="grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr)">' +
      card("Expenses", tableHTML(
        [{ t: "Date" }, { t: "Category" }, { t: "Item" }, { t: "Quantity", cls: "r" }, { t: "Amount", cls: "r" }, { t: "Supplier" }, { t: "", cls: "r" }],
        rows, '<tfoot><tr><td colspan="4">' + list.length + ' entries</td><td class="r">' + rp(total) + '</td><td colspan="2"></td></tr></tfoot>')) +
      card("Where the money went", rankList(catRank, { fmt: rpK, limit: 8 }), eF.month ? fmonth(eF.month) : "all time") +
    "</div>";
}
function expenseForm(e){
  recordForm({
    title: e ? "Edit expense" : "New expense", record: e,
    fields: [
      { name: "date", label: "Date", type: "date" },
      { name: "category", label: "Category", type: "option", key: "expenseCategory" },

/* =========================== accounting =========================== */
function viewAccounting(){
  const months = allMonths().slice().reverse();
  const cats = S.options.expenseCategory || [];

  const rows = months.map(mk => {
    const ro = revenueOrders(mk);
    const rev = revenueOf(ro), ship = deliveryCollected(ro);
    const ec = expenseByCat(mk);
    const exp = expenseTotal(expensesOf(mk));
    const net = rev + ship - exp;
    return "<tr><td><b>" + fmonth(mk) + "</b>" + '<div class="muted" style="font-size:11.5px">' + ro.length + " completed orders</div></td>" +
      '<td class="r">' + rp(rev) + "</td>" +
      '<td class="r">' + rp(ship) + "</td>" +
      cats.map(c => '<td class="r">' + (ec[c] ? rp(ec[c]) : '<span class="muted">—</span>') + "</td>").join("") +
      '<td class="r">' + rp(exp) + "</td>" +
      '<td class="r" style="color:' + (net >= 0 ? "var(--good)" : "var(--bad)") + '"><b>' + rp(net) + "</b></td>" +
      '<td class="r">' + ((rev + ship) ? pct(net / (rev + ship) * 100) : "—") + "</td></tr>";
  });

  const tot = months.reduce((a, mk) => {
    const ro = revenueOrders(mk);
    a.rev += revenueOf(ro); a.ship += deliveryCollected(ro); a.exp += expenseTotal(expensesOf(mk));
    return a;
  }, { rev: 0, ship: 0, exp: 0 });
  const foot = '<tfoot><tr><td>All time</td><td class="r">' + rp(tot.rev) + '</td><td class="r">' + rp(tot.ship) + "</td>" +
    cats.map(c => '<td class="r">' + rp(S.expenses.filter(e => e.category === c).reduce((s, e) => s + (Number(e.amount) || 0), 0)) + "</td>").join("") +
    '<td class="r">' + rp(tot.exp) + '</td><td class="r">' + rp(tot.rev + tot.ship - tot.exp) + '</td><td class="r"></td></tr></tfoot>';

  const pl = card("Monthly profit & loss", tableHTML(
    [{ t: "Month" }, { t: "Product revenue", cls: "r" }, { t: "Delivery collected", cls: "r" }].concat(cats.map(c => ({ t: c, cls: "r" })))
      .concat([{ t: "Total expenses", cls: "r" }, { t: "Net profit", cls: "r" }, { t: "Margin", cls: "r" }]),
    rows, foot), "everything is pulled from Orders and Expenses");

  /* cash flow */
  const open = Number(S.settings.openingCash) || 0;
  let running = open;
  const cfRows = months.slice().reverse().map(mk => {
    const ro = revenueOrders(mk);
    const inn = revenueOf(ro) + deliveryCollected(ro);
    const out = expenseTotal(expensesOf(mk));
    running += inn - out;
    return { mk, inn, out, end: running };
  }).reverse();
  const cf = card("Cash flow", tableHTML(
    [{ t: "Month" }, { t: "Cash in", cls: "r" }, { t: "Cash out", cls: "r" }, { t: "Movement", cls: "r" }, { t: "Ending cash", cls: "r" }],
    cfRows.map(r => "<tr><td><b>" + fmonth(r.mk) + '</b></td><td class="r" style="color:var(--good)">+ ' + rp(r.inn) +
      '</td><td class="r" style="color:var(--bad)">− ' + rp(r.out) + '</td><td class="r">' + rp(r.inn - r.out) +
      '</td><td class="r"><b>' + rp(r.end) + "</b></td></tr>")),
    "opening cash " + rp(open) + " — change it in Settings");

  const invVal = S.inventory.reduce((s, i) => s + (Number(i.stock) || 0) * (Number(i.costPerUnit) || 0), 0);
  const unpaid = S.orders.filter(o => !countsAsRevenue(o) && o.status !== "Cancelled");
  const summary = '<div class="kpis">' +
    kpi("k1", "Cash on hand", rp(running), '<span class="muted">opening ' + rpK(open) + " + all movements</span>") +
    kpi("k2", "All-time net profit", rp(tot.rev + tot.ship - tot.exp), '<span class="muted">' + rp(tot.rev + tot.ship) + " in · " + rp(tot.exp) + " out</span>") +
    kpi("k3", "Orders not yet counted", rp(unpaid.reduce((s, o) => s + orderPayment(o), 0)), '<span class="muted">' + unpaid.length + " orders still in the pipeline</span>") +
    kpi("k4", "Stock value", rp(invVal), '<span class="muted">' + S.inventory.length + " items in inventory</span>") + "</div>";

  return summary + pl + cf;
}

/* =========================== customers =========================== */

function viewCustomers(){
  let list = customers();
  if (cRepeatOnly) list = list.filter(c => c.repeat);

    '<td class="r"><button class="iconbtn" data-custorders="' + esc(c.name) + '" title="See their orders">▤</button></td></tr>');

  return head + filters + card("Customers", tableHTML(

    rows), "this list rebuilds itself every time you add an order");
}

/* =========================== content planner =========================== */
let contentMonth = null, contentMode = "list";
function viewContent(){
  const months = Array.from(new Set(S.content.map(c => ym(c.date)).concat([ym(today())]))).sort();
  if (!contentMonth || months.indexOf(contentMonth) < 0) contentMonth = months[months.length - 1];
  const list = S.content.filter(c => ym(c.date) === contentMonth).sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  const bar = '<div class="filters">' +
    '<div class="field" style="min-width:150px"><label>Month</label><select id="kMonth">' +
      months.map(m => '<option value="' + m + '"' + (m === contentMonth ? " selected" : "") + ">" + fmonth(m) + "</option>").join("") + "</select></div>" +
    '<div class="pill-row" style="align-self:center">' +
      '<button class="pill" data-cmode="list" aria-pressed="' + (contentMode === "list") + '">List</button>' +
      '<button class="pill" data-cmode="cal" aria-pressed="' + (contentMode === "cal") + '">Calendar</button></div></div>';

  const posted = list.filter(c => c.status === "Posted").length;
  const byPillar = {};
  list.forEach(c => { byPillar[c.pillar] = (byPillar[c.pillar] || 0) + 1; });

  let main;
  if (contentMode === "list"){
    main = card("Marketing calendar", tableHTML(
      [{ t: "Date" }, { t: "Platform" }, { t: "Type" }, { t: "Pillar" }, { t: "Content" }, { t: "Status" }, { t: "Results" }, { t: "", cls: "r" }],
      list.map(c =>
        '<tr><td class="nowrap">' + fdate(c.date, true) + '<div class="muted" style="font-size:11.5px">' + DOW[(new Date(c.date + "T00:00:00").getDay() + 6) % 7] + "</div></td>" +
        "<td>" + esc(c.platform) + "</td><td>" + esc(c.type) + "</td>" +
        '<td><span class="chip s-mute">' + esc(c.pillar) + "</span></td>" +
        "<td><b>" + esc(c.title) + "</b></td>" +
        "<td>" + statusChip(c.status) + "</td>" +
        "<td>" + (c.results ? esc(c.results) : '<span class="muted">—</span>') + "</td>" +
        '<td class="r"><div class="rowact"><button class="iconbtn" data-edit="' + esc(c.id) + '" title="Edit">✎</button>' +
        '<button class="iconbtn" data-del="' + esc(c.id) + '" title="Delete">🗑</button></div></td></tr>')),
      posted + " of " + list.length + " posted");
  } else {
    const y = +contentMonth.slice(0, 4), m = +contentMonth.slice(5, 7) - 1;
    const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    let cells = DOW.map(d => '<div class="hd">' + d + "</div>").join("");
    for (let i = 0; i < start; i++) cells += '<div class="day out"></div>';
    for (let d = 1; d <= days; d++){
      const key = contentMonth + "-" + String(d).padStart(2, "0");
      const evs = list.filter(c => c.date === key);
      cells += '<div class="day"><span class="dn">' + d + "</span>" +
        evs.map(c => '<span class="ev ' + (c.status === "Posted" ? "posted" : "") + '" data-edit="' + esc(c.id) + '" title="' + esc(c.platform + " · " + c.title) + '">' + esc(c.title) + "</span>").join("") + "</div>";
    }
    main = card("Marketing calendar", '<div class="cal">' + cells + "</div>", fmonth(contentMonth));
  }

  const pillarRank = Object.entries(byPillar).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));
  return bar + main +
    '<div class="chartgrid">' +
      card("Content pillars this month", rankList(pillarRank, { fmt: n => n + " posts", limit: 8 }), "keep the mix balanced") +
      card("What performed", S.content.filter(c => c.results).slice(-6).reverse().map(c =>
        '<div class="sumline"><span><b>' + esc(c.title) + '</b><br><span class="muted" style="font-size:11.5px">' + fdate(c.date, true) + " · " + esc(c.platform) + "</span></span>" +
        '<span class="muted" style="text-align:right;max-width:46%">' + esc(c.results) + "</span></div>").join("") || '<div class="empty">Fill in the results column to build this list</div>',
        "latest posts with results") +
    "</div>";
}
function contentForm(c){
  recordForm({
    title: c ? "Edit content" : "New content", record: c,
    fields: [
      { name: "date", label: "Date", type: "date" },
      { name: "platform", label: "Platform", type: "option", key: "platform" },
      { name: "type", label: "Content type", type: "option", key: "contentType" },
      { name: "pillar", label: "Content pillar", type: "option", key: "contentPillar" },
      { name: "status", label: "Status", type: "option", key: "contentStatus" },
      { name: "title", label: "Content idea", attrs: 'placeholder="Brownies fudgy pull-apart slow-mo"', full: true },
      { name: "results", label: "Results", type: "textarea", attrs: 'placeholder="4.2k views, 38 saves, 3 DM orders"', full: true }
    ],
    validate: d => !d.title ? "Describe the content" : "",
    toast: "Content saved",
    onSave: d => { if (c) Object.assign(c, d); else S.content.push(Object.assign({ id: uid("ct") }, d)); }
  });
}

<script>
/* =========================== settings =========================== */
function checkList(id, all, chosen){
  return '<div class="pill-row" id="' + id + '">' + all.map(o =>
    '<button type="button" class="pill" data-v="' + esc(o) + '" aria-pressed="' + chosen.includes(o) + '">' + esc(o) + "</button>").join("") + "</div>";
}
function viewSettings(){
  const st = S.settings;
  const rules = card("How the numbers are counted",
    '<div class="stack">' +
      '<div><div class="eyebrow" style="margin-bottom:7px">Statuses that count as revenue</div>' +
        checkList("setRev", S.options.orderStatus, st.revenueStatuses) +
        '<p class="muted" style="font-size:12px;margin:7px 0 0">Used by the dashboard, P&amp;L and customer spend.</p></div>' +
      '<div><div class="eyebrow" style="margin-bottom:7px">Statuses that fill a baking batch</div>' +
        checkList("setPipe", S.options.orderStatus, st.pipelineStatuses) +
        '<p class="muted" style="font-size:12px;margin:7px 0 0">Used for the fulfillment rate on each batch.</p></div>' +
      '<div><div class="eyebrow" style="margin-bottom:7px">Delivery methods with no fee</div>' +
        checkList("setFree", S.options.deliveryMethod, st.freeDelivery) +
        '<p class="muted" style="font-size:12px;margin:7px 0 0">The delivery fee is locked to 0 for these. For the others you type the ongkir yourself.</p></div>' +
      '<div class="formgrid"><div class="field"><label>Opening cash</label>' +
        '<input type="number" id="setCash" step="10000" value="' + (Number(st.openingCash) || 0) + '"></div></div>' +
    "</div>", "these rules drive every chart");

  const lists = card("Your dropdown lists",
    '<p class="muted" style="margin:0 0 11px;font-size:12.5px">Every dropdown in the app also has a ⚙ next to it — this is the same editor in one place. Renaming a choice updates the records that already use it.</p>' +
    '<div class="pill-row">' + Object.keys(OPTION_LABELS).map(k =>
      '<button class="pill" data-optedit="' + k + '">' + esc(OPTION_LABELS[k]) + ' <span class="muted">' + (S.options[k] || []).length + "</span></button>").join("") +
      '<button class="pill" data-editlist="flavors">Flavours <span class="muted">' + S.flavors.length + '</span></button>' +
      '<button class="pill" data-editlist="toppings">Toppings <span class="muted">' + S.toppings.length + "</span></button></div>", "add, rename or remove choices");

  const counts = [["orders", "orders"], ["expenses", "expenses"], ["content", "content posts"], ["products", "products"],
    ["batches", "batches"], ["inventory", "inventory items"], ["recipes", "recipes"], ["packaging", "packaging items"]];
  const data = card("Backup & restore",
    '<p class="muted" style="margin:0 0 12px;font-size:12.5px">Your data is stored in this browser only. It stays after you close the tab, but it does not travel to your phone on its own — ' +
    "download a backup and import it on the other device. Do this after every batch.</p>" +
    '<div class="row-split" style="gap:9px">' +
      '<button class="btn primary" id="btnCopy">⤓ Back up my data</button>' +
      '<label class="btn" style="cursor:pointer">⤒ Import backup<input type="file" id="fileImport" accept="application/json,.json" hidden></label>' +
      (S.settings.sample ? '<button class="btn danger" id="btnClearSample">Clear example data</button>' : "") +
      '<button class="btn danger" id="btnWipe">Delete everything</button>' +
    "</div>" +
    '<div class="muted" style="margin-top:13px;font-size:12.5px">Currently holding ' +
      counts.map(c => "<b>" + (S[c[0]] || []).length + "</b> " + c[1]).join(" · ") + "</div>", "keep your own copy");

  return '<div class="chartgrid" style="grid-template-columns:minmax(0,1fr)">' + rules + lists + data + "</div>";
}

/* =========================== backup =========================== */
function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "crave-bites-backup-" + today() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("If no file appeared, use Copy as text instead");
}
function backupModal(){
  const text = JSON.stringify(S);
  openModal({
    title: "Backup your data", size: "narrow", saveText: null, cancelText: "Close",
    body: '<p class="muted" style="margin:0;font-size:12.5px">Two ways to keep a copy. <b>Copy as text</b> always works — paste it into a note to yourself on WhatsApp. ' +
      "<b>Download a file</b> works when you open this page from your own link (GitHub Pages) but is blocked in some previews.</p>" +
      '<div class="row-split" style="gap:9px"><button type="button" class="btn primary" id="bkCopy">⧉ Copy as text</button>' +
      '<button type="button" class="btn" id="bkFile">⤓ Download a file</button></div>' +
      '<textarea id="bkText" readonly style="min-height:150px;font-family:ui-monospace,monospace;font-size:11px">' + esc(text) + "</textarea>" +
      '<div class="eyebrow">Restore — paste a backup here</div>' +
      '<textarea id="bkPaste" placeholder="Paste a backup here…" style="min-height:70px;font-size:11px"></textarea>' +
      '<button type="button" class="btn" id="bkRestore">Restore this backup</button>',
    onOpen: w => {
      $("#bkFile", w).onclick = exportJSON;
      $("#bkCopy", w).onclick = () => {
        const t = $("#bkText", w); t.focus(); t.select(); t.setSelectionRange(0, 999999);
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        if (navigator.clipboard) { try { navigator.clipboard.writeText(text); ok = true; } catch (e) {} }
        toast(ok ? "Copied — paste it somewhere safe" : "Press Ctrl/Cmd + C to copy the selected text");
      };
      $("#bkRestore", w).onclick = () => {
        try {
          const p = JSON.parse($("#bkPaste", w).value);
          if (!p || !p.options) throw 0;
          S = p; save(); render(); toast("Backup restored");
          w.querySelector("[data-close]").click();
        } catch (e) { toast("That does not look like a crave.bites backup"); }
      };
    }
  });
}
function importFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!p || !p.options) throw 0;
      S = p; save(); render(); toast("Backup imported");
    } catch (e) { toast("Could not read that file"); }
  };
  r.readAsText(file);
}

/* =========================== router =========================== */

  dashboard : { title: "Dashboard",        sub: "Everything below updates itself from your orders and expenses", fn: viewDashboard, actions: dashActions },
  orders    : { title: "Orders",           sub: "Your main sheet — one row per order", fn: viewOrders,

  production: { title: "Baking batches",   sub: "Plan what you bake and when", fn: viewProduction,
                actions: () => '<button class="btn primary" data-new="batch">+ New batch</button>' },
  products  : { title: "Products &amp; costs", sub: "Menu, recipes, packaging and what each item really costs", fn: viewProducts,
                actions: () => {
                  const map = { menu: ["product", "+ New product"], packaging: ["packaging", "+ New packaging"],
                    prices: ["pricelist", "+ New price version"], inventory: ["inventory", "+ New inventory item"] };
                  const m = map[productsTab];
                  return m ? '<button class="btn primary" data-new="' + m[0] + '">' + m[1] + "</button>" : "";
                } },
  expenses  : { title: "Expenses",         sub: "Every rupiah that leaves the business", fn: viewExpenses,
                actions: () => '<button class="btn primary" data-new="expense">+ New expense</button>' },
  accounting: { title: "Accounting",       sub: "Profit and loss, and cash flow — calculated, not typed", fn: viewAccounting, actions: () => "" },
  customers : { title: "Customers",        sub: "Built automatically from your orders", fn: viewCustomers, actions: () => "" },
  content   : { title: "Content planner",  sub: "Plan posts, then record what each one brought in", fn: viewContent,
                actions: () => '<button class="btn primary" data-new="content">+ New content</button>' },
  settings  : { title: "Settings &amp; backup", sub: "Rules, lists and your data", fn: viewSettings, actions: () => "" }
};
let currentView = "dashboard";
function go(v){ currentView = v; document.body.classList.remove("nav-open"); $("#navScrim").hidden = true; render(); window.scrollTo({ top: 0 }); }

function render(){
  const v = VIEWS[currentView] || VIEWS.dashboard;
  $("#viewTitle").innerHTML = v.title;
  $("#viewSub").textContent = v.sub;
  $("#topActions").innerHTML = v.actions ? v.actions() : "";
  $("#content").innerHTML = v.fn();
  $$("#nav .navbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === currentView));
  $("#ctOrders").textContent    = S.orders.length || "";
  $("#ctBatches").textContent   = S.batches.length || "";
  $("#ctExpenses").textContent  = S.expenses.length || "";
  $("#ctCustomers").textContent = customers().length || "";
}

/* =========================== events =========================== */
function wire(){
  $("#nav").addEventListener("click", e => { const b = e.target.closest(".navbtn"); if (b) go(b.dataset.view); });
  $("#burger").onclick = () => { document.body.classList.toggle("nav-open"); $("#navScrim").hidden = !document.body.classList.contains("nav-open"); };
  $("#navScrim").onclick = () => { document.body.classList.remove("nav-open"); $("#navScrim").hidden = true; };
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    try { localStorage.setItem(KEY + ".theme", dark ? "light" : "dark"); } catch (e) {}
  };
  $("#backupBtn").onclick = backupModal;

  /* top actions */
  $("#topActions").addEventListener("click", e => {
    const b = e.target.closest("[data-new]");
    if (!b) return;
    ({ order: () => orderForm(null), batch: () => batchForm(null), product: () => productForm(null),
       packaging: () => packagingForm(null), pricelist: () => priceListForm(null), inventory: () => inventoryForm(null),
       expense: () => expenseForm(null), content: () => contentForm(null) })[b.dataset.new]();
  });
  $("#topActions").addEventListener("change", e => {
    if (e.target.id === "dashMonth"){ dashMonth = e.target.value; render(); }
  });

  /* everything inside the content area */
  const C = $("#content");
  C.addEventListener("click", e => {
    const t = el => e.target.closest(el);
    let b;
    if ((b = t("[data-goto]"))){ if (b.dataset.tab) productsTab = b.dataset.tab; go(b.dataset.goto); return; }
    if ((b = t(".tab[data-tab]"))){ productsTab = b.dataset.tab; render(); return; }
    if ((b = t("[data-cmode]"))){ contentMode = b.dataset.cmode; render(); return; }
    if ((b = t("[data-optedit]"))){ optionEditor(b.dataset.optedit); return; }
    if ((b = t("[data-editlist]"))){ const c = b.dataset.editlist; priceListEditor(c, c === "flavors" ? "Flavours" : "Toppings", "Add-on price"); return; }
    if ((b = t("[data-costsetup]"))){ const [pid, size] = b.dataset.costsetup.split("|"); costSetupForm(pid, size); return; }
    if ((b = t("[data-recipe]"))){ recipeForm(b.dataset.recipe); return; }
    if ((b = t("[data-openorders]"))){ oF = { from: "", to: "", month: "", q: "", status: "", method: "", batch: b.dataset.openorders }; go("orders"); return; }
    if ((b = t("[data-custorders]"))){ oF = { from: "", to: "", month: "", q: b.dataset.custorders, status: "", method: "", batch: "" }; go("orders"); return; }
    if ((b = t(".pill[data-v]"))){
      const box = b.parentElement.id, v = b.dataset.v;
      const map = { setRev: "revenueStatuses", setPipe: "pipelineStatuses", setFree: "freeDelivery" }[box];
      if (!map) return;
      const arr = S.settings[map] || [];
      S.settings[map] = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat([v]);
      save(); render(); return;
    }
    if (e.target.id === "btnCopy"){ backupModal(); return; }
    if (e.target.id === "btnWipe"){
      confirmModal("Delete everything?", "Every order, product, expense and post in this browser will be gone. Download a backup first if you are not sure.",
        () => { S = blankState(); S.priceLists = [{ id: uid("pl"), name: "My prices", from: today(), note: "" }];
                save(); go("dashboard"); toast("All data cleared"); }, "Delete everything");
      return;
    }
    if (e.target.id === "btnClearSample"){
      confirmModal("Clear the example data?", "This removes the example orders, expenses and posts, and keeps your dropdown lists so you can start typing your own.",
        () => {
          S.orders = []; S.expenses = []; S.content = []; S.seq.order = 0; S.settings.sample = false;
          save(); go("dashboard"); toast("Example data cleared — the app is yours now");
        }, "Clear examples");
      return;
    }
    /* edit / delete per view */
    if ((b = t("[data-edit]"))){
      const id = b.dataset.edit;
      if (currentView === "orders")      orderForm(S.orders.find(o => o.id === id));
      else if (currentView === "production") batchForm(S.batches.find(x => x.id === id));
      else if (currentView === "expenses")   expenseForm(S.expenses.find(x => x.id === id));
      else if (currentView === "content")    contentForm(S.content.find(x => x.id === id));
      else if (currentView === "products"){
        if (productsTab === "menu")        productForm(S.products.find(x => x.id === id));
        else if (productsTab === "packaging") packagingForm(S.packaging.find(x => x.id === id));
        else if (productsTab === "prices")    priceListForm(S.priceLists.find(x => x.id === id));
        else if (productsTab === "inventory") inventoryForm(S.inventory.find(x => x.id === id));
      }
      return;
    }
    if ((b = t("[data-del]"))){
      const id = b.dataset.del;
      if (currentView === "orders")
        confirmModal("Delete order " + id + "?", "It disappears from every chart and from the customer list.",
          () => { S.orders = S.orders.filter(o => o.id !== id); save(); render(); toast("Order deleted"); });
      else if (currentView === "production") delRec("batches", id, "batch");
      else if (currentView === "expenses")   delRec("expenses", id, "expense");
      else if (currentView === "content")    delRec("content", id, "content");
      else if (currentView === "products"){
        if (productsTab === "menu")
          confirmModal("Delete this product?", "Old orders keep their line but will show a dash instead of the name.",
            () => { S.products = S.products.filter(p => p.id !== id); save(); render(); toast("Product deleted"); });
        else if (productsTab === "packaging") delRec("packaging", id, "packaging");
        else if (productsTab === "prices")    delRec("priceLists", id, "price version");
        else if (productsTab === "inventory") delRec("inventory", id, "inventory item");
      }
      return;
    }
  });

  C.addEventListener("input", e => {
    const id = e.target.id;
    if (id === "fQ"){ oF.q = e.target.value; debounceRender(); }
    if (id === "eQ"){ eF.q = e.target.value; debounceRender(); }
    if (id === "cQ"){ cQ  = e.target.value; debounceRender(); }
    if (id === "setCash"){ S.settings.openingCash = num(e.target.value); save(); }
  });
  C.addEventListener("change", e => {
    const id = e.target.id, v = e.target.value;
    const m = { fMonth: () => oF.month = v, fFrom: () => oF.from = v, fTo: () => oF.to = v,
      fStatus: () => oF.status = v, fMethod: () => oF.method = v, fBatch: () => oF.batch = v,
      eMonth: () => eF.month = v, eCat: () => eF.category = v,
      kMonth: () => contentMonth = v, costPL: () => costPL = v };
    if (m[id]){ m[id](); render(); return; }
    if (id === "fileImport" && e.target.files[0]) importFile(e.target.files[0]);
  });
  C.addEventListener("click", e => {
    if (e.target.id === "fClear"){ oF = { from: "", to: "", month: "", q: "", status: "", method: "", batch: "" }; render(); }
    if (e.target.id === "eClear"){ eF = { month: "", category: "", q: "" }; render(); }
    if (e.target.id === "cRepeat"){ cRepeatOnly = !cRepeatOnly; render(); }
  });
}
let rt = null;
function debounceRender(){
  clearTimeout(rt);
  rt = setTimeout(() => {
    const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
    render();
    if (id){ const n = document.getElementById(id); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
  }, 220);
}

/* =========================== boot =========================== */
(function init(){
  try { const th = localStorage.getItem(KEY + ".theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  S = load();
  if (!S){ S = seed(); save(); }
  if (!S.seq) S.seq = { order: S.orders.length };
  if (!S.priceLists.length) S.priceLists = [{ id: uid("pl"), name: "My prices", from: today(), note: "" }];
  Object.keys(DEFAULT_OPTIONS).forEach(k => { if (!S.options[k]) S.options[k] = DEFAULT_OPTIONS[k].slice(); });
  const ds = blankState().settings;
  Object.keys(ds).forEach(k => { if (S.settings[k] === undefined) S.settings[k] = ds[k]; });
  wire();
  render();
})();
</script>

</body>
</html>
